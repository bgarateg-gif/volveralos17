<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<title>Piano Synthesia – Práctica a Dos Manos, Ukelele y Violín</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --fg: #1E293B;
    --muted: #64748B;
    --bg: #F1F5F9;
    --card: #FFFFFF;
    --surface: #F8FAFC;
    --border: #E2E8F0;
    --primary: #4F46E5;
    --primary-hover: #4338CA;
    --lh-fill: #86EFAC;
    --lh-border: #22C55E;
    --rh-fill: #FDBA74;
    --rh-border: #F97316;
    --violin-accent: #7C3AED;
    --violin-bg: #F5F3FF;
    --violin-border: #C4B5FD;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  /* Compactado ligeramente a izquierda y derecha */
  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    max-width: 1180px;
    width: 100%;
    margin: 0 auto;
    padding: 10px 26px;
    gap: 10px;
    overflow: hidden;
  }

  /* Modo pantalla completa (nativo + modo estudio expandido para iOS/Android) */
  body.is-fullscreen {
    position: fixed !important;
    inset: 0 !important;
    max-width: none !important;
    width: 100vw !important;
    height: 100vh !important;
    height: 100dvh !important;
    z-index: 999999 !important;
    background: var(--bg) !important;
    padding: max(6px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)) !important;
    gap: 6px !important;
  }

  body.is-fullscreen .controls {
    padding: 5px 10px !important;
    gap: 6px 10px !important;
    border-radius: 12px !important;
  }

  body.is-fullscreen .legend-group,
  body.is-fullscreen .speed-group,
  body.is-fullscreen #toggle-extra,
  body.is-fullscreen .lbl {
    display: none !important;
  }

  body.is-fullscreen .transport-group {
    flex: 0 0 auto !important;
  }

  body.is-fullscreen .seek-group {
    flex: 1 1 120px !important;
  }

  body.is-fullscreen #play,
  body.is-fullscreen #stop,
  body.is-fullscreen #toggle-violin,
  body.is-fullscreen #fs {
    min-height: 32px !important;
    padding: 4px 10px !important;
    font-size: 13px !important;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(15, 23, 42, 0.05);
  }

  /* ============ Barra superior de controles ============ */
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 12px;
    align-items: center;
    padding: 9px 14px;
    flex-shrink: 0;
  }

  .group {
    display: flex;
    gap: 7px;
    align-items: center;
  }

  .transport-group {
    flex: 0 0 auto;
  }

  .speed-group {
    flex: 1 1 155px;
    max-width: 220px;
    min-width: 0;
  }

  .legend-group {
    flex: 0 0 auto;
    gap: 6px;
  }

  .seek-group {
    flex: 1 1 200px;
    min-width: 0;
  }

  .actions-right {
    display: flex;
    gap: 6px;
    align-items: center;
    margin-left: auto;
  }

  .lbl {
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    white-space: nowrap;
  }

  .hand-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 9px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 800;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--fg);
    white-space: nowrap;
  }

  .swatch {
    width: 11px;
    height: 11px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  .swatch.lh {
    background: var(--lh-fill);
    border: 1.5px solid var(--lh-border);
  }

  .swatch.rh {
    background: var(--rh-fill);
    border: 1.5px solid var(--rh-border);
  }

  button {
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    min-height: 35px;
    padding: 5px 12px;
    border-radius: 10px;
    cursor: pointer;
    touch-action: manipulation;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    white-space: nowrap;
    transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
  }

  button:active {
    transform: translateY(1px);
  }

  button:focus-visible,
  input:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
  }

  #play {
    background: var(--primary);
    color: #FFFFFF;
    border: none;
    padding: 5px 16px;
    box-shadow: 0 2px 8px rgba(79, 70, 229, 0.28);
  }

  #play:hover {
    background: var(--primary-hover);
    box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
  }

  .btn-sec {
    background: var(--surface);
    color: var(--fg);
    border: 1px solid var(--border);
  }

  .btn-sec:hover {
    background: #F1F5F9;
    border-color: #CBD5E1;
  }

  /* Botón opcional de pentagrama de Violín */
  #toggle-violin {
    background: var(--surface);
    color: var(--fg);
    border: 1.5px solid var(--border);
  }

  #toggle-violin:hover {
    background: var(--violin-bg);
    border-color: var(--violin-border);
    color: var(--violin-accent);
  }

  #toggle-violin[aria-pressed="true"] {
    background: var(--violin-accent);
    color: #FFFFFF;
    border-color: var(--violin-accent);
    box-shadow: 0 2px 8px rgba(124, 58, 237, 0.30);
  }

  #toggle-extra {
    display: none;
  }

  input[type=range] {
    flex: 1;
    min-width: 55px;
    height: 24px;
    accent-color: #4F46E5;
    cursor: pointer;
    margin: 0;
  }

  #speedv {
    min-width: 4ch;
    text-align: right;
    font-variant-numeric: tabular-nums;
    font-weight: 800;
    font-size: 13px;
    color: var(--fg);
  }

  #time {
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    min-width: 7.8ch;
    font-weight: 700;
    color: var(--muted);
  }

  /* ============ Tarjeta principal: Barra de Acordes + Ukelele + Synthesia ============ */
  .stage-card {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .chord-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 7px 16px;
    background: linear-gradient(180deg, #F8FAFC 0%, #FFFFFF 100%);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    min-height: 48px;
  }

  .chord-left {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .chord-tag {
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    background: var(--bg);
    padding: 3px 8px;
    border-radius: 6px;
    white-space: nowrap;
  }

  .chord-center {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex: 1;
  }

  #chord-current {
    font-size: 23px;
    font-weight: 900;
    color: var(--primary);
    letter-spacing: -0.02em;
    line-height: 1.1;
    padding: 2px 14px;
    border-radius: 10px;
    background: #EEF2FF;
    border: 1.5px solid #C7D2FE;
    transition: transform 0.12s ease, background-color 0.15s ease;
  }

  #chord-current.is-empty {
    color: var(--muted);
    background: var(--surface);
    border-color: var(--border);
    font-size: 15px;
    font-weight: 700;
  }

  #chord-root {
    font-size: 12px;
    font-weight: 800;
    color: #166534;
    background: #DCFCE7;
    border: 1px solid #86EFAC;
    padding: 3px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }

  #chord-root:empty {
    display: none;
  }

  .chord-right {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    white-space: nowrap;
  }

  #chord-next {
    font-weight: 800;
    color: var(--fg);
  }

  /* Contenedor horizontal: Recuadro de Ukelele a la izquierda + Escenario Piano/Violín a la derecha */
  .stage-body {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: row;
    width: 100%;
  }

  .ukulele-box {
    width: 168px;
    flex-shrink: 0;
    background: linear-gradient(180deg, #F8FAFC 0%, #F1F5F9 100%);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px 8px;
    gap: 6px;
    user-select: none;
  }

  .uke-header {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    background: #FFFFFF;
    border: 1px solid var(--border);
    padding: 2px 9px;
    border-radius: 999px;
  }

  .uke-chord-title {
    font-size: 17px;
    font-weight: 900;
    color: var(--fg);
    text-align: center;
    line-height: 1.15;
  }

  .uke-diagram-wrap {
    width: 100%;
    max-width: 136px;
    background: #FFFFFF;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 6px 4px 4px;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .uke-diagram-wrap svg {
    width: 100%;
    height: auto;
    display: block;
  }

  .uke-frets-pill {
    font-size: 12px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--primary);
    background: #EEF2FF;
    border: 1px solid #C7D2FE;
    padding: 2px 10px;
    border-radius: 999px;
    letter-spacing: 0.04em;
  }

  main {
    flex: 1;
    min-width: 0;
    min-height: 0;
    position: relative;
  }

  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    background: #0F172A;
    touch-action: none;
  }

  /* ============ Adaptación Móvil Vertical (Portrait) ============ */
  @media (max-width: 768px) {
    body {
      padding: 6px 10px;
      gap: 6px;
    }

    .controls {
      padding: 8px 10px;
      gap: 6px 8px;
      border-radius: 14px;
    }

    .transport-group {
      flex: 1 1 auto;
    }

    .transport-group #play {
      flex: 1;
    }

    #toggle-extra {
      display: inline-flex;
      padding: 5px 10px;
      font-size: 13px;
    }

    .controls.compact-mobile .speed-group,
    .controls.compact-mobile .legend-group {
      display: none;
    }

    .speed-group {
      flex: 1 1 100%;
      max-width: none;
    }

    .legend-group {
      flex: 1 1 auto;
    }

    .seek-group {
      flex: 1 1 100%;
    }

    .actions-right {
      margin-left: 0;
    }

    .fs-label {
      display: none;
    }

    #fs {
      padding: 5px 10px;
    }

    .stage-card {
      border-radius: 14px;
    }

    .chord-bar {
      padding: 6px 10px;
      min-height: 42px;
      gap: 6px;
    }

    .chord-tag {
      display: none;
    }

    #chord-current {
      font-size: 18px;
      padding: 2px 10px;
    }

    .chord-right {
      font-size: 12px;
    }

    .ukulele-box {
      width: 112px;
      padding: 6px 5px;
      gap: 4px;
    }

    .uke-chord-title {
      font-size: 14px;
    }

    .uke-frets-pill {
      font-size: 11px;
      padding: 1px 7px;
    }
  }

  /* ============ Adaptación Móvil Horizontal (Landscape) ============ */
  @media (max-height: 520px) and (orientation: landscape) {
    body {
      padding: 4px 10px;
      gap: 4px;
    }

    .controls {
      padding: 4px 8px;
      gap: 4px 8px;
      border-radius: 12px;
    }

    .controls.compact-mobile .speed-group,
    .controls.compact-mobile .legend-group {
      display: flex;
    }

    #toggle-extra,
    .lbl {
      display: none;
    }

    button {
      min-height: 30px;
      font-size: 12.5px;
      padding: 2px 9px;
      border-radius: 8px;
    }

    .hand-badge {
      padding: 2px 7px;
      font-size: 11px;
    }

    .speed-group {
      flex: 1 1 95px;
      max-width: 145px;
    }

    .seek-group {
      flex: 1 1 130px;
    }

    #time {
      font-size: 11.5px;
      min-width: 7ch;
    }

    input[type=range] {
      height: 20px;
      min-width: 45px;
    }

    .fs-label {
      display: none;
    }

    .stage-card {
      border-radius: 12px;
    }

    .chord-bar {
      padding: 3px 12px;
      min-height: 32px;
    }

    #chord-current {
      font-size: 15px;
      padding: 1px 9px;
    }

    .chord-right {
      font-size: 11px;
    }

    .ukulele-box {
      width: 118px;
      padding: 4px 5px;
      gap: 2px;
    }

    .uke-header {
      display: none;
    }

    .uke-chord-title {
      font-size: 13px;
    }

    .uke-diagram-wrap {
      max-width: 96px;
      padding: 3px 2px 2px;
    }

    .uke-frets-pill {
      font-size: 10.5px;
      padding: 1px 6px;
    }
  }
</style>
</head>
<body>

<div class="controls card" id="controls-bar">
  <div class="group transport-group">
    <button id="play"><span aria-hidden="true">▶</span> Iniciar</button>
    <button id="stop" class="btn-sec" title="Reiniciar">Reiniciar</button>
    <button id="toggle-extra" class="btn-sec" type="button" aria-expanded="true">Ajustes ▴</button>
  </div>

  <div class="group speed-group">
    <label class="lbl" for="speed">Velocidad</label>
    <input type="range" id="speed" min="50" max="200" step="5" value="100" aria-label="Velocidad">
    <output id="speedv" for="speed">100%</output>
  </div>

  <div class="group legend-group" aria-label="Código de colores por mano">
    <span class="hand-badge"><span class="swatch lh"></span>Mano Izq.</span>
    <span class="hand-badge"><span class="swatch rh"></span>Mano Der.</span>
  </div>

  <div class="group seek-group">
    <span id="time">0:00 / 0:00</span>
    <input type="range" id="seek" min="0" max="1" step="any" value="0" aria-label="Posición en la canción">
  </div>

  <div class="actions-right">
    <button id="toggle-violin" type="button" aria-pressed="false" title="Mostrar pentagrama de violín y destacar violín 2">
      <span aria-hidden="true">🎻</span><span>Violín</span>
    </button>
    <button id="fs" class="btn-sec" type="button" title="Pantalla completa">
      <span aria-hidden="true">⛶</span><span class="fs-label">Pantalla completa</span>
    </button>
  </div>
</div>

<section class="stage-card card">
  <header class="chord-bar" aria-live="polite">
    <div class="chord-left">
      <span class="chord-tag">Acorde actual</span>
    </div>
    <div class="chord-center">
      <span id="chord-current" class="is-empty">Cargando MIDIs…</span>
      <span id="chord-root"></span>
    </div>
    <div class="chord-right">
      <span>Siguiente:</span>
      <span id="chord-next">—</span>
    </div>
  </header>

  <div class="stage-body">
    <aside class="ukulele-box" aria-label="Posición del acorde en ukelele">
      <span class="uke-header">Ukelele</span>
      <div class="uke-chord-title" id="uke-chord-name">Re menor</div>
      <div class="uke-diagram-wrap" id="uke-diagram"></div>
      <div class="uke-frets-pill" id="uke-frets-text">2 · 2 · 1 · 0</div>
    </aside>

    <main id="stage"><canvas id="cv"></canvas></main>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.js"></script>
<script>
function initApp() {
  const el = id => document.getElementById(id);

  /* ============================================================================
     1. CONFIGURACIÓN DE ARCHIVOS MIDI Y ACORDES
     ============================================================================ */
  const MIDI_FILES = {
    melody:     "./midis/melodiaprincipal.mid",
    piano:      "./midis/piano.mid",          // Un solo MIDI de piano (2 pentagramas de MuseScore)
    violin:     "./midis/violin.mid",         // Tercer MIDI opcional de violín ("violin")
    violinAlt:  "./violin.mid",               // Respaldo por si está en la carpeta raíz
    leftAlt:    "./midis/pianoizquierda.mid", // Respaldo opcional si se exportan por separado
    rightAlt:   "./midis/pianoderecha.mid"    // Respaldo opcional si se exportan por separado
  };

  // Los acordes se evalúan en bloques de 3 pulsos (pulsos 1, 2 y 3 = mismo acorde)
  const PULSOS_POR_ACORDE = 3;

  // Punto de corte de respaldo solo si el MIDI de piano viniera en 1 sola pista y 1 canal:
  // 60 = Do4 (centro del rango A2–B4)
  const NOTA_DIVISION = 60;

  /**
   * DEFINICIÓN MANUAL DE ACORDES (OPCIONAL, POR COMPÁS DE 3 PULSOS):
   * - Si dejas esta lista vacía ([]), la app detecta AUTOMÁTICAMENTE el acorde
   *   cada 3 pulsos leyendo la nota fundamental del pulso 1.
   * - Si el mismo acorde continúa en el siguiente grupo de 3 pulsos, no se repite.
   */
  const ACORDES_MANUALES = [
    // { compas: 1, pulso: 1, acorde: "Re menor" },
    // { compas: 2, pulso: 1, acorde: "Fa Mayor" },
    // { compas: 3, pulso: 1, acorde: "Sol menor" },
    // { compas: 4, pulso: 1, acorde: "Do Mayor" },
    // { compas: 5, pulso: 1, acorde: "La 7" },
  ];

  /* Mapeo por nota fundamental (clase de altura MIDI 0..11) */
  const ACORDES_POR_FUNDAMENTAL = {
    2: { nombre: "Re menor",  nota: "Re"  }, // D
    5: { nombre: "Fa Mayor",  nota: "Fa"  }, // F
    7: { nombre: "Sol menor", nota: "Sol" }, // G
    0: { nombre: "Do Mayor",  nota: "Do"  }, // C
    9: { nombre: "La 7",      nota: "La"  }  // A
  };

  /* Diagramas de acordes para Ukelele (afinación estándar G - C - E - A) */
  const UKULELE_CHORDS = {
    "re menor":   { frets: [2, 2, 1, 0], fingers: [2, 3, 1, 0] },
    "dm":         { frets: [2, 2, 1, 0], fingers: [2, 3, 1, 0] },
    "fa mayor":   { frets: [2, 0, 1, 0], fingers: [2, 0, 1, 0] },
    "f":          { frets: [2, 0, 1, 0], fingers: [2, 0, 1, 0] },
    "sol menor":  { frets: [0, 2, 3, 1], fingers: [0, 2, 3, 1] },
    "gm":         { frets: [0, 2, 3, 1], fingers: [0, 2, 3, 1] },
    "do mayor":   { frets: [0, 0, 0, 3], fingers: [0, 0, 0, 3] },
    "c":          { frets: [0, 0, 0, 3], fingers: [0, 0, 0, 3] },
    "la 7":       { frets: [0, 1, 0, 0], fingers: [0, 1, 0, 0] },
    "a7":         { frets: [0, 1, 0, 0], fingers: [0, 1, 0, 0] },
    "la menor":   { frets: [2, 0, 0, 0], fingers: [2, 0, 0, 0] },
    "am":         { frets: [2, 0, 0, 0], fingers: [2, 0, 0, 0] },
    "sol mayor":  { frets: [0, 2, 3, 2], fingers: [0, 1, 3, 2] },
    "g":          { frets: [0, 2, 3, 2], fingers: [0, 1, 3, 2] },
    "re mayor":   { frets: [2, 2, 2, 0], fingers: [1, 2, 3, 0] },
    "d":          { frets: [2, 2, 2, 0], fingers: [1, 2, 3, 0] },
    "sib mayor":  { frets: [3, 2, 1, 1], fingers: [3, 2, 1, 1] },
    "bb":         { frets: [3, 2, 1, 1], fingers: [3, 2, 1, 1] },
    "mi menor":   { frets: [0, 4, 3, 2], fingers: [0, 3, 2, 1] },
    "em":         { frets: [0, 4, 3, 2], fingers: [0, 3, 2, 1] },
    "re 7":       { frets: [2, 2, 2, 3], fingers: [1, 1, 1, 2] },
    "d7":         { frets: [2, 2, 2, 3], fingers: [1, 1, 1, 2] },
    "sol 7":      { frets: [0, 2, 1, 2], fingers: [0, 2, 1, 3] },
    "g7":         { frets: [0, 2, 1, 2], fingers: [0, 2, 1, 3] },
    "do 7":       { frets: [0, 0, 0, 1], fingers: [0, 0, 0, 1] },
    "c7":         { frets: [0, 0, 0, 1], fingers: [0, 0, 0, 1] }
  };

  function renderUkuleleDiagram(chordName) {
    const cleanName = (chordName || "Re menor").trim();
    const shape = UKULELE_CHORDS[cleanName.toLowerCase()] || UKULELE_CHORDS["re menor"];
    const frets = shape.frets;
    const fingers = shape.fingers || [0, 0, 0, 0];

    el("uke-chord-name").textContent = cleanName;
    el("uke-frets-text").textContent = frets.map(f => (f < 0 ? "✕" : f)).join(" · ");

    const positiveFrets = frets.filter(f => f > 0);
    const maxFret = positiveFrets.length ? Math.max(...positiveFrets) : 3;
    const minFret = positiveFrets.length ? Math.min(...positiveFrets) : 1;
    const baseFret = maxFret > 4 ? minFret : 1;

    const stringNames = ["G", "C", "E", "A"];
    const startX = 28;
    const stepX = 25;
    const topY = 38;
    const fretH = 24;
    const numFrets = 4;
    const endX = startX + stepX * 3;
    const endY = topY + fretH * numFrets;

    let svg = `<svg viewBox="0 0 124 146" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Acorde ${cleanName} en ukelele: ${frets.join("-")}">`;

    // Nombres de cuerdas arriba (G C E A)
    for (let s = 0; s < 4; s++) {
      const x = startX + s * stepX;
      svg += `<text x="${x}" y="14" text-anchor="middle" font-family="Nunito, sans-serif" font-size="10.5" font-weight="800" fill="#64748B">${stringNames[s]}</text>`;
    }

    // Círculos de cuerda al aire (0) o X de cuerda muteada
    for (let s = 0; s < 4; s++) {
      const x = startX + s * stepX;
      const f = frets[s];
      if (f === 0) {
        svg += `<circle cx="${x}" cy="27" r="4.2" fill="none" stroke="#22C55E" stroke-width="1.8"/>`;
      } else if (f < 0) {
        svg += `<text x="${x}" y="31" text-anchor="middle" font-family="Nunito, sans-serif" font-size="11" font-weight="800" fill="#EF4444">✕</text>`;
      }
    }

    // Líneas horizontales de los trastes y números de traste
    for (let f = 0; f <= numFrets; f++) {
      const y = topY + f * fretH;
      const isNut = (f === 0 && baseFret === 1);
      svg += `<line x1="${startX - 1}" y1="${y}" x2="${endX + 1}" y2="${y}" stroke="${isNut ? "#1E293B" : "#CBD5E1"}" stroke-width="${isNut ? 4.2 : 1.5}" stroke-linecap="round"/>`;
      if (f < numFrets) {
        const fretNum = baseFret + f;
        const labelY = y + fretH / 2 + 3.5;
        svg += `<text x="14" y="${labelY}" text-anchor="middle" font-family="Nunito, sans-serif" font-size="10" font-weight="700" fill="#94A3B8">${fretNum}</text>`;
      }
    }

    // 4 cuerdas verticales
    for (let s = 0; s < 4; s++) {
      const x = startX + s * stepX;
      svg += `<line x1="${x}" y1="${topY}" x2="${x}" y2="${endY}" stroke="#64748B" stroke-width="${1.8 - s * 0.15}"/>`;
    }

    // Puntos de digitación en los trastes
    for (let s = 0; s < 4; s++) {
      const f = frets[s];
      if (f > 0) {
        const relFret = f - baseFret + 1;
        if (relFret >= 1 && relFret <= numFrets) {
          const cx = startX + s * stepX;
          const cy = topY + (relFret - 0.5) * fretH;
          const finger = fingers[s];
          svg += `<circle cx="${cx}" cy="${cy}" r="8.5" fill="#4F46E5" stroke="#FFFFFF" stroke-width="1.5"/>`;
          if (finger > 0) {
            svg += `<text x="${cx}" y="${cy + 3.5}" text-anchor="middle" font-family="Nunito, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF">${finger}</text>`;
          }
        }
      }
    }

    svg += `</svg>`;
    el("uke-diagram").innerHTML = svg;
  }

  // Render inicial del diagrama de ukelele
  renderUkuleleDiagram("Re menor");

  /* ============================================================================
     2. RANGO DEL PIANO: DE A2 (45) A B4 (71) SIN CORRECCIÓN FORZADA DE OCTAVA
     ============================================================================ */
  const MIN_MIDI = 45; // A2 (La 2)
  const MAX_MIDI = 71; // B4 (Si 4)
  // Nomenclatura adaptada a la tonalidad (con Sib en lugar de La#)
  const NOTE_NAMES_ES = ["Do", "Do#", "Re", "Mib", "Mi", "Fa", "Fa#", "Sol", "Sol#", "La", "Sib", "Si"];
  const BLACK_PCS = new Set([1, 3, 6, 8, 10]);

  const PIANO_KEYS = [];
  const WHITE_KEYS = [];
  const BLACK_KEYS = [];
  const KEY_BY_MIDI = {};

  for (let m = MIN_MIDI; m <= MAX_MIDI; m++) {
    const pc = m % 12;
    const octave = Math.floor(m / 12) - 1;
    const isBlack = BLACK_PCS.has(pc);
    const labelEs = NOTE_NAMES_ES[pc] + (pc === 0 || m === MIN_MIDI || m === MAX_MIDI ? octave : "");
    const keyObj = {
      midi: m,
      pc,
      octave,
      isBlack,
      label: labelEs,
      whiteIndex: WHITE_KEYS.length,
      x: 0,
      w: 0,
      h: 0
    };
    PIANO_KEYS.push(keyObj);
    KEY_BY_MIDI[m] = keyObj;
    if (isBlack) {
      BLACK_KEYS.push(keyObj);
    } else {
      WHITE_KEYS.push(keyObj);
    }
  }

  /* ============================================================================
     3. SONIDO REAL DE PIANO, VOZ/MELODÍA Y VIOLÍN (Tone.js)
     ============================================================================ */
  let violinMode = false;

  /* Reverb sutil de sala para calidez acústica */
  const roomReverb = new Tone.Reverb({
    decay: 1.4,
    preDelay: 0.01,
    wet: 0.18
  }).toDestination();

  /* Piano de respaldo acústico (modelado armónico con filtro dinámico, por si no hay red) */
  const pianoFallbackFilter = new Tone.Filter({
    type: "lowpass",
    frequency: 2600,
    Q: 0.7
  }).connect(roomReverb);

  const pianoFallbackSynth = new Tone.PolySynth(Tone.Synth, {
    oscillator: {
      type: "custom",
      partials: [1, 0.55, 0.28, 0.16, 0.08, 0.04, 0.015]
    },
    envelope: {
      attack: 0.006,
      decay: 0.65,
      sustain: 0.18,
      release: 0.45
    }
  }).connect(pianoFallbackFilter);

  /* Muestreador de Piano Acústico Real (Salamander Grand Piano) */
  let pianoSamplerLoaded = false;
  const pianoSampler = new Tone.Sampler({
    urls: {
      "A1": "A1.mp3",
      "C2": "C2.mp3",
      "D#2": "D%232.mp3",
      "F#2": "F%232.mp3",
      "A2": "A2.mp3",
      "C3": "C3.mp3",
      "D#3": "D%233.mp3",
      "F#3": "F%233.mp3",
      "A3": "A3.mp3",
      "C4": "C4.mp3",
      "D#4": "D%234.mp3",
      "F#4": "F%234.mp3",
      "A4": "A4.mp3",
      "C5": "C5.mp3"
    },
    release: 0.55,
    baseUrl: "https://tonejs.github.io/audio/salamander/",
    onload: () => {
      pianoSamplerLoaded = true;
    },
    onerror: () => {
      pianoSamplerLoaded = false;
    }
  }).connect(roomReverb);

  function triggerPianoNote(midi, durSec, time, vel) {
    const freqOrNote = Tone.Frequency(midi, "midi").toNote();
    if (pianoSamplerLoaded) {
      pianoSampler.triggerAttackRelease(freqOrNote, durSec, time, vel);
    } else {
      pianoFallbackSynth.triggerAttackRelease(freqOrNote, durSec, time, vel);
    }
  }

  function releaseAllPiano() {
    try { pianoSampler.releaseAll(); } catch (e) {}
    try { pianoFallbackSynth.releaseAll(); } catch (e) {}
  }

  /* Melodía principal / Voz de fondo */
  const vibrato = new Tone.Vibrato(4.5, 0.05).connect(roomReverb);
  const melodySynth = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "custom", partials: [1, 0.22, 0.05] },
    envelope: { attack: 0.04, decay: 0.12, sustain: 0.80, release: 0.18 }
  }).connect(vibrato);

  /* Violín 1 y Violín 2 (timbre expresivo de cuerda frotada con vibrato) */
  const violinFilter = new Tone.Filter({
    type: "lowpass",
    frequency: 3400,
    Q: 1.1
  }).connect(roomReverb);

  const violinVibrato = new Tone.Vibrato(5.2, 0.065).connect(violinFilter);

  const violin1Synth = new Tone.PolySynth(Tone.Synth, {
    oscillator: {
      type: "custom",
      partials: [1, 0.80, 0.62, 0.46, 0.32, 0.20, 0.11]
    },
    envelope: {
      attack: 0.075,
      decay: 0.14,
      sustain: 0.86,
      release: 0.24
    }
  }).connect(violinVibrato);

  const violin2Synth = new Tone.PolySynth(Tone.Synth, {
    oscillator: {
      type: "custom",
      partials: [1, 0.85, 0.68, 0.52, 0.36, 0.24, 0.14]
    },
    envelope: {
      attack: 0.07,
      decay: 0.14,
      sustain: 0.88,
      release: 0.24
    }
  }).connect(violinVibrato);

  function releaseAllViolin() {
    try { violin1Synth.releaseAll(); } catch (e) {}
    try { violin2Synth.releaseAll(); } catch (e) {}
  }

  /* Balance de volúmenes según si el pentagrama de Violín está seleccionado */
  function updateAudioMix() {
    if (violinMode) {
      // Baja el volumen del teclado y la voz, y deja más fuerte el violín (especialmente violín 2)
      pianoSampler.volume.value = -5;
      pianoFallbackSynth.volume.value = -10;
      melodySynth.volume.value = -3;
      violin1Synth.volume.value = -1;
      violin2Synth.volume.value = 2.5;
    } else {
      pianoSampler.volume.value = 1;
      pianoFallbackSynth.volume.value = -4;
      melodySynth.volume.value = -3;
      violin1Synth.volume.value = -Infinity;
      violin2Synth.volume.value = -Infinity;
      releaseAllViolin();
    }
  }

  updateAudioMix();

  /* Metrónomo suave solo para el compás de cuenta previa */
  const clickSynth = new Tone.MembraneSynth({
    pitchDecay: 0.008,
    octaves: 2,
    envelope: { attack: 0.001, decay: 0.07, sustain: 0, release: 0.01 }
  }).toDestination();
  clickSynth.volume.value = -13;

  /* ============================================================================
     4. CARGA DE MIDIS, SEPARACIÓN DE MANOS Y DETECCIÓN DE ACORDES CADA 3 PULSOS
     ============================================================================ */
  let song = {
    leftNotes: [],
    rightNotes: [],
    melodyNotes: [],
    violinNotes: [],
    hasViolinMidi: false,
    chords: [],
    bpm: 100,
    num: 3,
    lead: 3,
    endBeat: 1,
    loaded: false
  };
  let speed = 1;
  let posTicks = 0;

  async function fetchMidiFile(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`No se pudo cargar ${url}`);
    const buf = await res.arrayBuffer();
    const MidiClass = (window.Midi && window.Midi.Midi) || window.Midi;
    return new MidiClass(buf);
  }

  function extractRawNotes(midiObj) {
    const out = [];
    if (!midiObj) return out;
    const ppq = midiObj.header.ppq || 480;
    midiObj.tracks.forEach(tr => {
      if (tr.instrument && tr.instrument.percussion) return;
      tr.notes.forEach(n => {
        out.push({
          midi: n.midi,
          startBeatRaw: n.ticks / ppq,
          durBeats: Math.max(0.08, n.durationTicks / ppq),
          vel: n.velocity || 0.8
        });
      });
    });
    return out.sort((a, b) => a.startBeatRaw - b.startBeatRaw);
  }

  /* Extrae pistas de violín diferenciando Violín 1 y Violín 2 si hay 2 pistas */
  function extractViolinRawNotes(violinMidi) {
    const out = [];
    if (!violinMidi) return out;
    const ppq = violinMidi.header.ppq || 480;
    const validTracks = violinMidi.tracks.filter(
      tr => (!tr.instrument || !tr.instrument.percussion) && tr.notes.length > 0
    );

    validTracks.forEach((tr, trackIdx) => {
      // Si hay 1 sola pista, se asigna a Violín 2 (protagonista fuerte).
      // Si hay 2 o más pistas, pista 0 = Violín 1 y pista 1+ = Violín 2 (más fuerte).
      const voice = validTracks.length === 1 ? 2 : (trackIdx === 0 ? 1 : 2);
      tr.notes.forEach(n => {
        out.push({
          midi: n.midi,
          voice,
          startBeatRaw: n.ticks / ppq,
          durBeats: Math.max(0.08, n.durationTicks / ppq),
          vel: n.velocity || 0.85
        });
      });
    });

    return out.sort((a, b) => a.startBeatRaw - b.startBeatRaw);
  }

  /* Separa automáticamente un único MIDI de piano (MuseScore) en mano izquierda y derecha */
  function splitPianoHands(pianoMidi) {
    if (!pianoMidi) return { leftRaw: [], rightRaw: [] };
    const ppq = pianoMidi.header.ppq || 480;

    const validTracks = pianoMidi.tracks
      .filter(tr => (!tr.instrument || !tr.instrument.percussion) && tr.notes.length > 0)
      .map((tr, idx) => {
        const notes = tr.notes.map(n => ({
          midi: n.midi,
          channel: tr.channel || 0,
          startBeatRaw: n.ticks / ppq,
          durBeats: Math.max(0.08, n.durationTicks / ppq),
          vel: n.velocity || 0.8
        }));
        const avgPitch = notes.reduce((acc, n) => acc + n.midi, 0) / notes.length;
        return { idx, notes, avgPitch };
      });

    if (!validTracks.length) return { leftRaw: [], rightRaw: [] };

    if (validTracks.length >= 2) {
      validTracks.sort((a, b) => {
        if (Math.abs(a.avgPitch - b.avgPitch) > 0.5) return a.avgPitch - b.avgPitch;
        return b.idx - a.idx;
      });
      const leftRaw = validTracks[0].notes.sort((a, b) => a.startBeatRaw - b.startBeatRaw);
      const rightRaw = validTracks
        .slice(1)
        .flatMap(t => t.notes)
        .sort((a, b) => a.startBeatRaw - b.startBeatRaw);
      return { leftRaw, rightRaw };
    }

    const singleNotes = validTracks[0].notes;
    const channels = [...new Set(singleNotes.map(n => n.channel))];
    if (channels.length >= 2) {
      const byChannel = channels.map(ch => {
        const chNotes = singleNotes.filter(n => n.channel === ch);
        const avg = chNotes.reduce((acc, n) => acc + n.midi, 0) / chNotes.length;
        return { chNotes, avg };
      }).sort((a, b) => a.avg - b.avg);

      return {
        leftRaw: byChannel[0].chNotes.sort((a, b) => a.startBeatRaw - b.startBeatRaw),
        rightRaw: byChannel.slice(1).flatMap(c => c.chNotes).sort((a, b) => a.startBeatRaw - b.startBeatRaw)
      };
    }

    const leftRaw = [];
    const rightRaw = [];
    for (const n of singleNotes) {
      if (n.midi < NOTA_DIVISION) {
        leftRaw.push(n);
      } else {
        rightRaw.push(n);
      }
    }
    return {
      leftRaw: leftRaw.sort((a, b) => a.startBeatRaw - b.startBeatRaw),
      rightRaw: rightRaw.sort((a, b) => a.startBeatRaw - b.startBeatRaw)
    };
  }

  /**
   * Construye la línea de tiempo de acordes agrupados de 3 pulsos en 3 pulsos:
   * - En cada bloque de 3 pulsos (pulsos 1, 2 y 3), lee la nota fundamental del
   *   primer ataque del bloque (pulso 1).
   * - Todos los 3 pulsos pertenecen a ese mismo acorde.
   * - Solo se registra cuando aparece por primera vez o cambia a un acorde distinto.
   */
  function buildChordTimeline(leftNotes, rightNotes, leadBeats) {
    if (ACORDES_MANUALES.length > 0) {
      const timeline = [];
      let lastChordName = "";
      const sortedManual = [...ACORDES_MANUALES].sort((a, b) => {
        const beatA = (Math.max(1, a.compas || 1) - 1) * PULSOS_POR_ACORDE + (Math.max(1, a.pulso || 1) - 1);
        const beatB = (Math.max(1, b.compas || 1) - 1) * PULSOS_POR_ACORDE + (Math.max(1, b.pulso || 1) - 1);
        return beatA - beatB;
      });

      for (const item of sortedManual) {
        const compas = Math.max(1, item.compas || 1);
        const pulso = Math.max(1, item.pulso || 1);
        const beat = leadBeats + (compas - 1) * PULSOS_POR_ACORDE + (pulso - 1);
        const nombre = item.acorde.trim();
        if (nombre && nombre !== lastChordName) {
          const foundEntry = Object.values(ACORDES_POR_FUNDAMENTAL).find(
            c => c.nombre.toLowerCase() === nombre.toLowerCase()
          );
          timeline.push({
            startBeat: beat,
            nombre,
            nota: foundEntry ? foundEntry.nota : ""
          });
          lastChordName = nombre;
        }
      }
      return timeline;
    }

    const sourceNotes = leftNotes.length > 0 ? leftNotes : rightNotes;
    if (!sourceNotes.length) return [];

    const blocks = new Map();
    for (const n of sourceNotes) {
      const relBeat = Math.max(0, n.startBeat - leadBeats);
      const blockIdx = Math.floor((relBeat + 0.05) / PULSOS_POR_ACORDE);

      if (!blocks.has(blockIdx)) {
        blocks.set(blockIdx, {
          blockIdx,
          firstBeat: n.startBeat,
          lowestMidi: n.midi
        });
      } else {
        const blk = blocks.get(blockIdx);
        if (Math.abs(n.startBeat - blk.firstBeat) < 0.08) {
          if (n.midi < blk.lowestMidi) blk.lowestMidi = n.midi;
        }
      }
    }

    const sortedBlocks = [...blocks.values()].sort((a, b) => a.blockIdx - b.blockIdx);
    const timeline = [];
    let lastChordName = "";

    for (const blk of sortedBlocks) {
      const pc = ((blk.lowestMidi % 12) + 12) % 12;
      const chordInfo = ACORDES_POR_FUNDAMENTAL[pc];
      if (chordInfo && chordInfo.nombre !== lastChordName) {
        timeline.push({
          startBeat: blk.firstBeat,
          nombre: chordInfo.nombre,
          nota: chordInfo.nota
        });
        lastChordName = chordInfo.nombre;
      }
    }

    return timeline;
  }

  function setupSongData(melodyMidi, pianoMidi, violinMidi, leftAltMidi, rightAltMidi) {
    resetPlayback();
    const T = Tone.Transport;
    T.cancel();
    const ppq = 480;
    T.PPQ = ppq;

    const refMidi = melodyMidi || pianoMidi || violinMidi || rightAltMidi || leftAltMidi;
    const bpm = (refMidi && refMidi.header.tempos.length) ? refMidi.header.tempos[0].bpm : 100;
    const rawNum = (refMidi && refMidi.header.timeSignatures.length)
      ? refMidi.header.timeSignatures[0].timeSignature[0]
      : PULSOS_POR_ACORDE;
    const num = Math.min(Math.max(rawNum || PULSOS_POR_ACORDE, 2), 6);
    const lead = PULSOS_POR_ACORDE; // 1 compás de 3 pulsos de preparación visual

    let leftRaw = [];
    let rightRaw = [];

    if (pianoMidi) {
      const split = splitPianoHands(pianoMidi);
      leftRaw = split.leftRaw;
      rightRaw = split.rightRaw;
    } else {
      leftRaw = extractRawNotes(leftAltMidi);
      rightRaw = extractRawNotes(rightAltMidi);
    }

    const melodyRaw = extractRawNotes(melodyMidi);
    const violinRaw = extractViolinRawNotes(violinMidi);

    const mapHandNotes = (rawList, hand) => rawList.map(n => ({
      midi: n.midi,
      displayMidi: n.midi,
      voice: n.voice || 1,
      hand,
      startBeat: n.startBeatRaw + lead,
      durBeats: n.durBeats,
      vel: n.vel
    }));

    const melodyNotes = mapHandNotes(melodyRaw, "melody");
    const leftNotes   = mapHandNotes(leftRaw,   "left");
    const rightNotes  = mapHandNotes(rightRaw,  "right");
    const violinNotes = mapHandNotes(violinRaw, "violin");

    const chords = buildChordTimeline(leftNotes, rightNotes, lead);

    const allNotes = [...melodyNotes, ...leftNotes, ...rightNotes, ...violinNotes];
    const maxBeat = allNotes.reduce((acc, n) => Math.max(acc, n.startBeat + n.durBeats), lead + 3);

    song = {
      melodyNotes,
      leftNotes,
      rightNotes,
      violinNotes,
      hasViolinMidi: violinNotes.length > 0,
      chords,
      bpm,
      num,
      lead,
      endBeat: maxBeat + 1.5,
      loaded: allNotes.length > 0
    };

    // Melodía principal / Voz
    melodyNotes.forEach(n => {
      const startTicks = Math.round(n.startBeat * ppq);
      const durTicks = Math.max(24, Math.round(n.durBeats * ppq * 0.94));
      T.schedule(time => {
        const dSec = Math.max(new Tone.Ticks(durTicks).toSeconds(), 0.08);
        melodySynth.triggerAttackRelease(Tone.Frequency(n.midi, "midi").toFrequency(), dSec, time, n.vel * 0.80);
      }, startTicks + "i");
    });

    // Piano acústico (mano izquierda y mano derecha)
    [...leftNotes, ...rightNotes].forEach(n => {
      const startTicks = Math.round(n.startBeat * ppq);
      const durTicks = Math.max(24, Math.round(n.durBeats * ppq * 0.94));
      T.schedule(time => {
        const dSec = Math.max(new Tone.Ticks(durTicks).toSeconds(), 0.10);
        triggerPianoNote(n.midi, dSec, time, n.vel * 0.92);
      }, startTicks + "i");
    });

    // Violín (solo suena cuando violinMode está seleccionado)
    violinNotes.forEach(n => {
      const startTicks = Math.round(n.startBeat * ppq);
      const durTicks = Math.max(24, Math.round(n.durBeats * ppq * 0.96));
      T.schedule(time => {
        if (!violinMode) return;
        const dSec = Math.max(new Tone.Ticks(durTicks).toSeconds(), 0.10);
        const freq = Tone.Frequency(n.midi, "midi").toFrequency();
        if (n.voice === 2) {
          violin2Synth.triggerAttackRelease(freq, dSec, time, Math.min(1, n.vel * 1.05));
        } else {
          violin1Synth.triggerAttackRelease(freq, dSec, time, n.vel * 0.82);
        }
      }, startTicks + "i");
    });

    // Clic de cuenta previa solo durante el primer compás de 3 pulsos (lead)
    T.scheduleRepeat(time => {
      const b = Math.round(T.getTicksAtTime(time) / ppq);
      if (b < lead) {
        clickSynth.triggerAttackRelease(b === 0 ? "C3" : "G2", "32n", time);
      }
    }, "4n");

    T.bpm.value = bpm * speed;
    el("seek").max = song.endBeat;
    el("seek").value = 0;
    updateChordDisplay(0);
  }

  async function loadAllMidis() {
    const [melRes, pianoRes, violinRes] = await Promise.allSettled([
      fetchMidiFile(MIDI_FILES.melody),
      fetchMidiFile(MIDI_FILES.piano),
      fetchMidiFile(MIDI_FILES.violin)
    ]);

    const melodyMidi = melRes.status === "fulfilled" ? melRes.value : null;
    const pianoMidi  = pianoRes.status === "fulfilled" ? pianoRes.value : null;
    let violinMidi   = violinRes.status === "fulfilled" ? violinRes.value : null;

    if (!violinMidi) {
      try {
        violinMidi = await fetchMidiFile(MIDI_FILES.violinAlt);
      } catch (e) {
        violinMidi = null;
      }
    }

    let leftAltMidi = null;
    let rightAltMidi = null;

    if (!pianoMidi) {
      const [lRes, rRes] = await Promise.allSettled([
        fetchMidiFile(MIDI_FILES.leftAlt),
        fetchMidiFile(MIDI_FILES.rightAlt)
      ]);
      leftAltMidi  = lRes.status === "fulfilled" ? lRes.value : null;
      rightAltMidi = rRes.status === "fulfilled" ? rRes.value : null;
    }

    if (!melodyMidi && !pianoMidi && !violinMidi && !leftAltMidi && !rightAltMidi) {
      el("chord-current").textContent = "Falta ./midis/piano.mid";
      el("chord-current").classList.add("is-empty");
      return;
    }

    setupSongData(melodyMidi, pianoMidi, violinMidi, leftAltMidi, rightAltMidi);
  }

  /* ============================================================================
     5. BARRA DE ACORDES SUPERIOR + DIAGRAMA DE UKELELE
     ============================================================================ */
  let lastRenderedChord = "";

  function updateChordDisplay(beat) {
    const curEl = el("chord-current");
    const rootEl = el("chord-root");
    const nextEl = el("chord-next");

    if (!song.chords.length) {
      if (song.loaded) {
        curEl.textContent = "Re menor";
        curEl.classList.remove("is-empty");
        rootEl.textContent = "Base: Re";
        renderUkuleleDiagram("Re menor");
      }
      nextEl.textContent = "—";
      return;
    }

    let activeIdx = -1;
    for (let i = 0; i < song.chords.length; i++) {
      if (beat >= song.chords[i].startBeat - 0.04) {
        activeIdx = i;
      } else {
        break;
      }
    }

    if (activeIdx === -1) {
      const first = song.chords[0];
      const keyStr = "prep:" + first.nombre;
      if (lastRenderedChord !== keyStr) {
        lastRenderedChord = keyStr;
        curEl.textContent = first.nombre;
        curEl.classList.remove("is-empty");
        rootEl.textContent = first.nota ? `Prepárate · Base: ${first.nota}` : "Prepárate";
        nextEl.textContent = song.chords[1] ? song.chords[1].nombre : "—";
        renderUkuleleDiagram(first.nombre);
      }
      return;
    }

    const current = song.chords[activeIdx];
    const next = song.chords[activeIdx + 1];
    const keyStr = activeIdx + ":" + current.nombre;

    if (lastRenderedChord !== keyStr) {
      lastRenderedChord = keyStr;
      curEl.textContent = current.nombre;
      curEl.classList.remove("is-empty");
      rootEl.textContent = current.nota ? `Base: ${current.nota}` : "";
      nextEl.textContent = next ? next.nombre : "Final";
      renderUkuleleDiagram(current.nombre);

      curEl.style.transform = "scale(1.05)";
      setTimeout(() => { curEl.style.transform = "scale(1)"; }, 130);
    }
  }

  /* ============================================================================
     6. CONTROLES DE REPRODUCCIÓN, VIOLÍN OPCIONAL, VELOCIDAD Y PANTALLA COMPLETA
     ============================================================================ */
  const ticksNow = () => Tone.Transport.getTicksAtTime(Tone.getContext().currentTime);
  const getBeat = () => (Tone.Transport.state === "started" ? ticksNow() : posTicks) / Tone.Transport.PPQ;

  function setPlayButtonState(playing) {
    el("play").innerHTML = playing
      ? '<span aria-hidden="true">⏸</span> Pausa'
      : '<span aria-hidden="true">▶</span> Iniciar';
  }

  function resetPlayback() {
    Tone.Transport.stop();
    posTicks = 0;
    melodySynth.releaseAll();
    releaseAllPiano();
    releaseAllViolin();
    setPlayButtonState(false);
    el("seek").value = 0;
    lastRenderedChord = "";
    updateChordDisplay(0);
  }

  el("play").addEventListener("click", async () => {
    await Tone.start();
    const T = Tone.Transport;
    if (T.state === "started") {
      posTicks = ticksNow();
      T.pause();
      melodySynth.releaseAll();
      releaseAllPiano();
      releaseAllViolin();
      setPlayButtonState(false);
    } else {
      if (posTicks / T.PPQ >= song.endBeat - 0.01) posTicks = 0;
      T.start(undefined, Math.round(posTicks) + "i");
      setPlayButtonState(true);
    }
  });

  el("stop").addEventListener("click", resetPlayback);

  /* Botón opcional de pentagrama de violín */
  const violinBtn = el("toggle-violin");
  violinBtn.addEventListener("click", async () => {
    await Tone.start();
    violinMode = !violinMode;
    violinBtn.setAttribute("aria-pressed", String(violinMode));
    updateAudioMix();
    computeLayout();
  });

  el("speed").addEventListener("input", e => {
    const v = parseInt(e.target.value, 10);
    speed = v / 100;
    el("speedv").textContent = v + "%";
    Tone.Transport.bpm.value = song.bpm * speed;
  });

  /* Colapsar/mostrar ajustes secundarios en móvil vertical */
  const controlsBar = el("controls-bar");
  const toggleExtraBtn = el("toggle-extra");
  toggleExtraBtn.addEventListener("click", () => {
    const compact = controlsBar.classList.toggle("compact-mobile");
    toggleExtraBtn.setAttribute("aria-expanded", String(!compact));
    toggleExtraBtn.textContent = compact ? "Ajustes ▾" : "Ajustes ▴";
    requestAnimationFrame(resize);
  });

  /* Pantalla completa híbrida (PC/Android nativo + modo estudio en iOS) */
  function updateFsButton(active) {
    el("fs").innerHTML = active
      ? '<span aria-hidden="true">✕</span><span class="fs-label">Salir</span>'
      : '<span aria-hidden="true">⛶</span><span class="fs-label">Pantalla completa</span>';
  }

  function enterStudyFullscreen() {
    document.body.classList.add("is-fullscreen");
    updateFsButton(true);
    window.scrollTo(0, 1);
    setTimeout(resize, 60);
  }

  function exitStudyFullscreen() {
    document.body.classList.remove("is-fullscreen");
    updateFsButton(false);
    setTimeout(resize, 60);
  }

  function toggleFullscreen() {
    const nativeFS = document.fullscreenElement || document.webkitFullscreenElement;
    const cssFS = document.body.classList.contains("is-fullscreen");

    if (!nativeFS && !cssFS) {
      enterStudyFullscreen();
      const doc = document.documentElement;
      const req = doc.requestFullscreen || doc.webkitRequestFullscreen;
      if (typeof req === "function") {
        try {
          const p = req.call(doc);
          if (p && typeof p.catch === "function") p.catch(() => {});
        } catch (e) {}
      }
    } else {
      exitStudyFullscreen();
      if (nativeFS) {
        try {
          if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen().catch(() => {});
        } catch (e) {}
      }
    }
  }

  el("fs").addEventListener("click", toggleFullscreen);
  document.addEventListener("fullscreenchange", () => {
    if (!document.fullscreenElement && document.body.classList.contains("is-fullscreen")) {
      exitStudyFullscreen();
    } else {
      resize();
    }
  });

  /* Deslizante de avanzar y retroceder en la canción */
  const seek = el("seek");
  let dragging = false, wasPlaying = false, lastSeek = 0;

  seek.addEventListener("pointerdown", () => {
    dragging = true;
    wasPlaying = Tone.Transport.state === "started";
    if (wasPlaying) {
      posTicks = ticksNow();
      Tone.Transport.pause();
      melodySynth.releaseAll();
      releaseAllPiano();
      releaseAllViolin();
    }
  });

  function endDrag() {
    if (!dragging) return;
    dragging = false;
    posTicks = Math.round(parseFloat(seek.value) * Tone.Transport.PPQ);
    if (wasPlaying) {
      Tone.Transport.start(undefined, posTicks + "i");
      wasPlaying = false;
    }
  }

  ["pointerup", "pointercancel", "change"].forEach(ev => seek.addEventListener(ev, endDrag));

  seek.addEventListener("input", () => {
    lastSeek = performance.now();
    posTicks = Math.round(parseFloat(seek.value) * Tone.Transport.PPQ);
    if (!dragging && Tone.Transport.state === "started") {
      Tone.Transport.pause();
      melodySynth.releaseAll();
      releaseAllPiano();
      releaseAllViolin();
      Tone.Transport.start(undefined, posTicks + "i");
    }
  });

  /* ============================================================================
     7. RENDERIZADO SYNTHESIA (CAÍDA + TECLADO A2-B4 + PENTAGRAMA DE VIOLÍN)
     ============================================================================ */
  const cv = el("cv");
  const ctx = cv.getContext("2d");
  const stage = el("stage");

  let W = 800, H = 450, dpr = 1;
  const L = {
    keyH: 130,
    fallH: 320,
    staffH: 0,
    whiteW: 42,
    blackW: 25,
    blackH: 80,
    pxPerBeat: 110
  };

  function computeLayout() {
    const isPortraitMobile = W < 650 && H >= W;
    const isLandscapeMobile = H < 500 && W > H;

    if (violinMode) {
      // Al seleccionar el violín, el teclado sube y deja espacio inferior al pentagrama
      if (isPortraitMobile) {
        L.staffH = Math.max(105, Math.min(138, Math.round(H * 0.26)));
        L.keyH   = Math.max(85,  Math.min(120, Math.round(H * 0.21)));
      } else if (isLandscapeMobile) {
        L.staffH = Math.max(82,  Math.min(110, Math.round(H * 0.30)));
        L.keyH   = Math.max(66,  Math.min(92,  Math.round(H * 0.25)));
      } else {
        L.staffH = Math.max(115, Math.min(155, Math.round(H * 0.27)));
        L.keyH   = Math.max(98,  Math.min(140, Math.round(H * 0.22)));
      }
    } else {
      L.staffH = 0;
      if (isPortraitMobile) {
        L.keyH = Math.max(105, Math.min(148, Math.round(H * 0.24)));
      } else if (isLandscapeMobile) {
        L.keyH = Math.max(78, Math.min(112, Math.round(H * 0.30)));
      } else {
        L.keyH = Math.max(125, Math.min(180, Math.round(H * 0.25)));
      }
    }

    L.fallH = Math.max(70, H - L.keyH - L.staffH);
    L.whiteW = W / WHITE_KEYS.length; // 16 teclas blancas de A2 a B4
    L.blackW = L.whiteW * 0.60;
    L.blackH = L.keyH * 0.62;

    const visibleBeats = isLandscapeMobile ? 3.4 : (isPortraitMobile ? 4.8 : 4.5);
    L.pxPerBeat = Math.max(46, L.fallH / visibleBeats);

    WHITE_KEYS.forEach((k, idx) => {
      k.x = idx * L.whiteW;
      k.w = L.whiteW;
      k.h = L.keyH;
    });

    BLACK_KEYS.forEach(k => {
      const boundaryX = k.whiteIndex * L.whiteW;
      k.x = boundaryX - L.blackW / 2;
      k.w = L.blackW;
      k.h = L.blackH;
    });
  }

  function resize() {
    const r = stage.getBoundingClientRect();
    W = Math.max(220, Math.floor(r.width));
    H = Math.max(160, Math.floor(r.height));
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = W * dpr;
    cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    computeLayout();
  }

  new ResizeObserver(resize).observe(stage);
  window.addEventListener("resize", resize);
  resize();

  /* Permite tocar las teclas del piano directamente en pantalla */
  let manualPressedMidi = null;

  function findKeyAtPoint(px, py) {
    if (py < L.fallH || py > L.fallH + L.keyH) return null;
    const localY = py - L.fallH;
    for (const bk of BLACK_KEYS) {
      if (px >= bk.x && px <= bk.x + bk.w && localY <= bk.h) return bk;
    }
    for (const wk of WHITE_KEYS) {
      if (px >= wk.x && px <= wk.x + wk.w) return wk;
    }
    return null;
  }

  cv.addEventListener("pointerdown", async e => {
    const rect = cv.getBoundingClientRect();
    const key = findKeyAtPoint(e.clientX - rect.left, e.clientY - rect.top);
    if (!key) return;
    await Tone.start();
    manualPressedMidi = key.midi;
    triggerPianoNote(key.midi, "4n", undefined, 0.85);
  });

  ["pointerup", "pointercancel", "pointerleave"].forEach(ev => {
    cv.addEventListener(ev, () => { manualPressedMidi = null; });
  });

  function roundRectPath(x, y, w, h, r) {
    const radius = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.lineTo(x + w - radius, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
    ctx.lineTo(x + w, y + h - radius);
    ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
    ctx.lineTo(x + radius, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
    ctx.lineTo(x, y + radius);
    ctx.quadraticCurveTo(x, y, x + radius, y);
    ctx.closePath();
  }

  function drawBackgroundGrid(beat) {
    ctx.fillStyle = "#0F172A";
    ctx.fillRect(0, 0, W, L.fallH);

    for (let i = 0; i < WHITE_KEYS.length; i++) {
      const wk = WHITE_KEYS[i];
      if (wk.pc === 0) {
        ctx.strokeStyle = "rgba(148, 163, 184, 0.24)";
        ctx.lineWidth = 1.2;
      } else {
        ctx.strokeStyle = "rgba(148, 163, 184, 0.08)";
        ctx.lineWidth = 1;
      }
      ctx.beginPath();
      ctx.moveTo(wk.x, 0);
      ctx.lineTo(wk.x, L.fallH);
      ctx.stroke();
    }

    // Líneas horizontales cada 3 pulsos (cada bloque de acorde)
    const m = PULSOS_POR_ACORDE;
    const maxVisibleBeat = beat + L.fallH / L.pxPerBeat + 1;
    let b = Math.max(0, Math.floor(beat / m) * m);
    for (; b <= maxVisibleBeat; b += m) {
      const y = L.fallH - (b - beat) * L.pxPerBeat;
      if (y < 0 || y > L.fallH) continue;
      ctx.strokeStyle = "rgba(148, 163, 184, 0.18)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }
  }

  function drawFallingNotes(beat) {
    const activeHandsByMidi = new Map();
    const topVisibleBeat = beat + L.fallH / L.pxPerBeat + 0.5;

    const renderNoteBlock = (n) => {
      if (n.startBeat > topVisibleBeat) return;
      if (n.startBeat + n.durBeats < beat - 0.15) return;

      const key = KEY_BY_MIDI[n.displayMidi];
      if (!key) return;

      const isActive = beat >= n.startBeat && beat < n.startBeat + n.durBeats;
      if (isActive) {
        activeHandsByMidi.set(n.displayMidi, n.hand);
      }

      const bottomY = L.fallH - (n.startBeat - beat) * L.pxPerBeat;
      const rawH = n.durBeats * L.pxPerBeat;
      const blockH = Math.max(8, rawH - 2);
      const topY = bottomY - blockH;

      const clampedBottom = Math.min(L.fallH, bottomY);
      const clampedTop = Math.max(-20, topY);
      const drawH = clampedBottom - clampedTop;
      if (drawH <= 1) return;

      const padX = key.isBlack ? 1.5 : 2.5;
      const bx = key.x + padX;
      const bw = Math.max(6, key.w - padX * 2);

      let fillColor, borderColor, textColor;
      if (n.hand === "left") {
        fillColor = key.isBlack ? "#4ADE80" : "#86EFAC";
        borderColor = "#22C55E";
        textColor = "#052E16";
      } else {
        fillColor = key.isBlack ? "#FB923C" : "#FDBA74";
        borderColor = "#F97316";
        textColor = "#431407";
      }

      ctx.save();
      if (isActive) {
        ctx.shadowColor = fillColor;
        ctx.shadowBlur = 14;
      }

      roundRectPath(bx, clampedTop, bw, drawH, 6);
      ctx.fillStyle = fillColor;
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.lineWidth = isActive ? 2.2 : 1.3;
      ctx.strokeStyle = isActive ? "#FFFFFF" : borderColor;
      ctx.stroke();

      if (drawH >= 18 && bw >= 15) {
        const fontSize = Math.max(9, Math.min(13, Math.round(bw * 0.35)));
        ctx.fillStyle = textColor;
        ctx.font = `800 ${fontSize}px 'Nunito', sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "bottom";
        ctx.fillText(NOTE_NAMES_ES[key.pc], bx + bw / 2, clampedBottom - 3);
      }

      ctx.restore();
    };

    const allHandNotes = [...song.leftNotes, ...song.rightNotes];
    for (const n of allHandNotes) {
      const k = KEY_BY_MIDI[n.displayMidi];
      if (k && !k.isBlack) renderNoteBlock(n);
    }
    for (const n of allHandNotes) {
      const k = KEY_BY_MIDI[n.displayMidi];
      if (k && k.isBlack) renderNoteBlock(n);
    }

    return activeHandsByMidi;
  }

  function drawPianoKeyboard(activeHandsByMidi) {
    const topY = L.fallH;

    // 1. 16 teclas blancas (A2 a B4)
    for (const wk of WHITE_KEYS) {
      const hand = activeHandsByMidi.get(wk.midi);
      const isManual = manualPressedMidi === wk.midi;
      let fill = "#FFFFFF";
      if (hand === "left") fill = "#86EFAC";
      else if (hand === "right") fill = "#FDBA74";
      else if (isManual) fill = "#C7D2FE";

      ctx.fillStyle = fill;
      ctx.fillRect(wk.x, topY, wk.w, wk.h);

      ctx.strokeStyle = "#94A3B8";
      ctx.lineWidth = 1;
      ctx.strokeRect(wk.x + 0.5, topY + 0.5, wk.w - 1, wk.h - 1);

      const showAllLabels = wk.w >= 22;
      if (showAllLabels || wk.pc === 0 || wk.midi === MIN_MIDI || wk.midi === MAX_MIDI) {
        const fontSize = Math.max(8, Math.min(13, Math.round(wk.w * 0.29)));
        ctx.fillStyle = hand ? "#0F172A" : (wk.pc === 0 ? "#4F46E5" : "#64748B");
        ctx.font = `${wk.pc === 0 ? "900" : "700"} ${fontSize}px 'Nunito', sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "bottom";
        ctx.fillText(wk.label, wk.x + wk.w / 2, topY + wk.h - 5);
      }
    }

    // 2. 11 teclas negras (con Sib en lugar de La#)
    for (const bk of BLACK_KEYS) {
      const hand = activeHandsByMidi.get(bk.midi);
      const isManual = manualPressedMidi === bk.midi;
      let fill = "#1E293B";
      if (hand === "left") fill = "#4ADE80";
      else if (hand === "right") fill = "#FB923C";
      else if (isManual) fill = "#818CF8";

      ctx.save();
      roundRectPath(bk.x, topY, bk.w, bk.h, 4);
      ctx.fillStyle = fill;
      ctx.fill();

      ctx.lineWidth = 1.2;
      ctx.strokeStyle = hand ? "#FFFFFF" : "#0F172A";
      ctx.stroke();

      if (bk.pc === 10 && bk.w >= 15) {
        const fontSize = Math.max(8, Math.min(11, Math.round(bk.w * 0.44)));
        ctx.fillStyle = hand ? "#052E16" : "#CBD5E1";
        ctx.font = `800 ${fontSize}px 'Nunito', sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "bottom";
        ctx.fillText("Sib", bk.x + bk.w / 2, topY + bk.h - 4);
      }
      ctx.restore();
    }

    // 3. Línea de impacto luminosa superior
    ctx.fillStyle = "#4F46E5";
    ctx.fillRect(0, topY - 2, W, 3);
  }

  /* ============================================================================
     8. PENTAGRAMA DE VIOLÍN (CLAVE DE SOL, DESPLAZAMIENTO HORIZONTAL)
     ============================================================================ */
  // Mapeo diatónico en Clave de Sol (0 = línea inferior E4, 8 = línea superior F5)
  const PC_TO_STAFF_INFO = {
    0:  { step: 0, acc: ""  }, // Do
    1:  { step: 0, acc: "♯" }, // Do#
    2:  { step: 1, acc: ""  }, // Re
    3:  { step: 2, acc: "♭" }, // Mib
    4:  { step: 2, acc: ""  }, // Mi
    5:  { step: 3, acc: ""  }, // Fa
    6:  { step: 3, acc: "♯" }, // Fa#
    7:  { step: 4, acc: ""  }, // Sol
    8:  { step: 4, acc: "♯" }, // Sol#
    9:  { step: 5, acc: ""  }, // La
    10: { step: 6, acc: "♭" }, // Sib
    11: { step: 6, acc: ""  }  // Si
  };

  function midiToTrebleStep(midi) {
    const pc = ((midi % 12) + 12) % 12;
    const octave = Math.floor(midi / 12) - 1;
    const info = PC_TO_STAFF_INFO[pc];
    // E4 (midi 64) => octave 4, step 2 => base = 4*7 + 2 = 30
    const absStep = octave * 7 + info.step - 30;
    return { step: absStep, acc: info.acc, pc };
  }

  function drawViolinStaff(beat) {
    if (!violinMode || L.staffH <= 0) return;

    const staffTop = L.fallH + L.keyH;
    const staffH = L.staffH;

    ctx.save();
    ctx.beginPath();
    ctx.rect(0, staffTop, W, staffH);
    ctx.clip();

    // Fondo claro tipo partitura
    ctx.fillStyle = "#FFFDF9";
    ctx.fillRect(0, staffTop, W, staffH);

    // Borde superior separador respecto al teclado
    ctx.fillStyle = "#7C3AED";
    ctx.fillRect(0, staffTop, W, 3);

    // Geometría de las 5 líneas del pentagrama
    const lineGap = Math.max(7.5, Math.min(11.5, staffH * 0.082));
    const halfStep = lineGap / 2;
    const bottomLineY = staffTop + staffH * 0.66; // Línea 1 (E4)
    const topLineY = bottomLineY - 4 * lineGap;   // Línea 5 (F5)

    // Dibujar las 5 líneas del pentagrama
    ctx.strokeStyle = "#94A3B8";
    ctx.lineWidth = 1.15;
    for (let i = 0; i < 5; i++) {
      const y = bottomLineY - i * lineGap;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }

    const clefAreaW = 54;
    const playheadX = Math.min(92, Math.max(72, W * 0.12));
    const staffPxPerBeat = Math.max(54, Math.min(96, W / 10.5));

    // Barras divisorias de compás (cada 3 pulsos)
    const m = PULSOS_POR_ACORDE;
    const minBeatVisible = beat - (playheadX - clefAreaW) / staffPxPerBeat - 1;
    const maxBeatVisible = beat + (W - playheadX) / staffPxPerBeat + 2;
    let b = Math.max(0, Math.floor(minBeatVisible / m) * m);
    for (; b <= maxBeatVisible; b += m) {
      const x = playheadX + (b - beat) * staffPxPerBeat;
      if (x < clefAreaW) continue;
      ctx.strokeStyle = "#CBD5E1";
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(x, topLineY);
      ctx.lineTo(x, bottomLineY);
      ctx.stroke();

      const measureNum = Math.round(b / m);
      if (measureNum >= 1) {
        ctx.fillStyle = "#94A3B8";
        ctx.font = "700 10px 'Nunito', sans-serif";
        ctx.textAlign = "left";
        ctx.textBaseline = "bottom";
        ctx.fillText(String(measureNum), x + 4, topLineY - 3);
      }
    }

    // Si no se encontró violin.mid, mostrar aviso claro
    if (!song.hasViolinMidi) {
      ctx.fillStyle = "#6D28D9";
      ctx.font = "800 13px 'Nunito', sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("Coloca el archivo ./midis/violin.mid para ver y escuchar el pentagrama de violín", W / 2 + 20, (topLineY + bottomLineY) / 2);
    } else {
      // Dibujar las notas del violín desplazándose horizontalmente hacia el cursor
      const rx = lineGap * 0.62;
      const ry = lineGap * 0.46;

      for (const n of song.violinNotes) {
        if (n.startBeat + n.durBeats < minBeatVisible) continue;
        if (n.startBeat > maxBeatVisible) break;

        const nx = playheadX + (n.startBeat - beat) * staffPxPerBeat;
        if (nx < clefAreaW - 16) continue;

        const { step, acc, pc } = midiToTrebleStep(n.midi);
        const ny = bottomLineY - step * halfStep;
        const isActive = beat >= n.startBeat && beat < n.startBeat + n.durBeats;
        const isVoice2 = n.voice === 2;

        const noteColor = isActive
          ? "#DC2626"
          : (isVoice2 ? "#6D28D9" : "#0F766E");

        // Barra horizontal sutil de duración
        const durW = Math.max(rx * 2, n.durBeats * staffPxPerBeat - 4);
        ctx.fillStyle = isActive ? "rgba(220, 38, 38, 0.16)" : "rgba(124, 58, 237, 0.10)";
        roundRectPath(nx - rx, ny - ry * 0.8, durW, ry * 1.6, 4);
        ctx.fill();

        // Líneas adicionales (ledger lines) por debajo de E4 (step <= -2) o por encima de F5 (step >= 10)
        ctx.strokeStyle = "#64748B";
        ctx.lineWidth = 1.2;
        if (step <= -2) {
          for (let s = -2; s >= step; s -= 2) {
            const ly = bottomLineY - s * halfStep;
            ctx.beginPath();
            ctx.moveTo(nx - rx - 4, ly);
            ctx.lineTo(nx + rx + 4, ly);
            ctx.stroke();
          }
        } else if (step >= 10) {
          for (let s = 10; s <= step; s += 2) {
            const ly = bottomLineY - s * halfStep;
            ctx.beginPath();
            ctx.moveTo(nx - rx - 4, ly);
            ctx.lineTo(nx + rx + 4, ly);
            ctx.stroke();
          }
        }

        // Alteración (♯ o ♭) a la izquierda de la cabeza de nota
        if (acc) {
          ctx.fillStyle = noteColor;
          ctx.font = `800 ${Math.round(lineGap * 1.35)}px 'Nunito', sans-serif`;
          ctx.textAlign = "right";
          ctx.textBaseline = "middle";
          ctx.fillText(acc, nx - rx - 2, ny);
        }

        // Cabeza de nota (óvalo ligeramente inclinado)
        const isHollow = n.durBeats >= 1.75; // Blanca o blanca con puntillo
        ctx.save();
        ctx.translate(nx, ny);
        ctx.rotate(-0.28);
        ctx.beginPath();
        ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
        if (isHollow) {
          ctx.fillStyle = "#FFFDF9";
          ctx.fill();
          ctx.lineWidth = 1.9;
          ctx.strokeStyle = noteColor;
          ctx.stroke();
        } else {
          ctx.fillStyle = noteColor;
          ctx.fill();
        }
        ctx.restore();

        // Puntillo si dura ~3 pulsos (blanca con puntillo)
        if (n.durBeats >= 2.75 && n.durBeats <= 3.3) {
          ctx.fillStyle = noteColor;
          ctx.beginPath();
          ctx.arc(nx + rx + 4.5, ny - (step % 2 === 0 ? halfStep * 0.45 : 0), 2.1, 0, Math.PI * 2);
          ctx.fill();
        }

        // Plica (stem) para figuras menores a redonda (< 3.75 pulsos)
        if (n.durBeats < 3.75) {
          const stemH = lineGap * 2.85;
          const stemUp = step < 4; // Hacia arriba por debajo de Si4, hacia abajo desde Si4
          ctx.strokeStyle = noteColor;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          if (stemUp) {
            ctx.moveTo(nx + rx - 0.8, ny);
            ctx.lineTo(nx + rx - 0.8, ny - stemH);
          } else {
            ctx.moveTo(nx - rx + 0.8, ny);
            ctx.lineTo(nx - rx + 0.8, ny + stemH);
          }
          ctx.stroke();

          // Corchete si dura <= 0.6 pulsos
          if (n.durBeats <= 0.6) {
            ctx.beginPath();
            if (stemUp) {
              ctx.moveTo(nx + rx - 0.8, ny - stemH);
              ctx.quadraticCurveTo(nx + rx + 6, ny - stemH + 5, nx + rx + 4, ny - stemH + 12);
            } else {
              ctx.moveTo(nx - rx + 0.8, ny + stemH);
              ctx.quadraticCurveTo(nx - rx + 6, ny + stemH - 5, nx - rx + 4, ny + stemH - 12);
            }
            ctx.stroke();
          }
        }

        // Nombre de la nota debajo del pentagrama para lectura rápida
        if (staffH >= 96) {
          const labelY = Math.min(staffTop + staffH - 4, Math.max(bottomLineY + lineGap * 1.6, ny + lineGap * 1.45));
          ctx.fillStyle = isActive ? "#DC2626" : "#475569";
          ctx.font = `${isActive ? "900" : "700"} 10px 'Nunito', sans-serif`;
          ctx.textAlign = "center";
          ctx.textBaseline = "bottom";
          ctx.fillText(NOTE_NAMES_ES[pc], nx, labelY);
        }
      }
    }

    // Cursor vertical de lectura actual (playhead)
    ctx.strokeStyle = "#EF4444";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(playheadX, staffTop + 5);
    ctx.lineTo(playheadX, staffTop + staffH - 4);
    ctx.stroke();

    // Cabecera izquierda fija con Clave de Sol (𝄞)
    ctx.fillStyle = "#F8FAFC";
    ctx.fillRect(0, staffTop + 3, clefAreaW, staffH - 3);
    ctx.strokeStyle = "#E2E8F0";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(clefAreaW, staffTop + 3);
    ctx.lineTo(clefAreaW, staffTop + staffH);
    ctx.stroke();

    // Redibujar las 5 líneas dentro de la cabecera de clave
    ctx.strokeStyle = "#94A3B8";
    ctx.lineWidth = 1.15;
    for (let i = 0; i < 5; i++) {
      const y = bottomLineY - i * lineGap;
      ctx.beginPath();
      ctx.moveTo(4, y);
      ctx.lineTo(clefAreaW, y);
      ctx.stroke();
    }

    // Símbolo de Clave de Sol
    ctx.fillStyle = "#1E293B";
    ctx.font = `${Math.round(lineGap * 5.2)}px serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("𝄞", 24, bottomLineY - lineGap * 1.85);

    // Etiqueta discreta "Violín"
    ctx.fillStyle = "#7C3AED";
    ctx.font = "800 9.5px 'Nunito', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    ctx.fillText("VIOLÍN", clefAreaW / 2, staffTop + 6);

    ctx.restore();
  }

  const fmtTime = s => {
    s = Math.max(0, Math.round(s));
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  };

  function frame() {
    const beat = getBeat() || 0;

    drawBackgroundGrid(beat);
    const activeHands = drawFallingNotes(beat);
    drawPianoKeyboard(activeHands);
    drawViolinStaff(beat);
    updateChordDisplay(beat);

    if (song.loaded) {
      const spb = 60 / (song.bpm * speed);
      const cur = Math.min(beat, song.endBeat);
      el("time").textContent = fmtTime(cur * spb) + " / " + fmtTime(song.endBeat * spb);
      if (!dragging && performance.now() - lastSeek > 150) {
        seek.value = Math.min(beat, song.endBeat);
      }
    }

    if (Tone.Transport.state === "started" && beat > song.endBeat) {
      resetPlayback();
    }

    requestAnimationFrame(frame);
  }

  loadAllMidis();
  requestAnimationFrame(frame);
}

if (document.readyState === "complete") {
  initApp();
} else {
  window.addEventListener("load", initApp);
}
</script>
</body>
</html>
