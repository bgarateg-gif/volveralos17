<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Piano Studio">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F1F5F9">
<title>Piano Synthesia – Práctica a Dos Manos, Ukelele y Violín</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --fg: #1E293B;
    --muted: #64748B;
    --bg: #F1F5F9;
    --card: #FFFFFF;
    --surface: #F8FAFC;
    --border: #E2E8F0;
    --primary: #4F46E5;
    --primary-hover: #4338CA;
    --lh-fill: #86EFAC;
    --lh-border: #22C55E;
    --rh-fill: #FDBA74;
    --rh-border: #F97316;
    --violin-accent: #7C3AED;
    --violin-bg: #F5F3FF;
    --violin-border: #C4B5FD;
    --uke-accent: #0D9488;
    --uke-bg: #F0FDFA;
    --uke-border: #99F6E4;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  /* En escritorio mantenemos altura fija de ventana */
  body {
    min-height: 100vh;
    min-height: 100dvh;
  }

  /* En navegadores móviles (Safari / Chrome iOS), damos un margen extra de scroll
     al documento para que al deslizar hacia arriba el navegador oculte su barra
     de direcciones y pestañas, mientras .app-shell queda fijada arriba. */
  @media (hover: none) and (pointer: coarse) {
    body:not(.is-standalone) {
      min-height: calc(100vh + 84px);
      min-height: calc(100lvh + 40px);
    }
  }

  .app-shell {
    position: sticky;
    top: 0;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    max-width: 1180px;
    width: 100%;
    margin: 0 auto;
    padding: max(8px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
    gap: 8px;
    overflow: hidden;
  }

  /* Modo pantalla completa / estudio expandido */
  body.is-fullscreen .app-shell {
    max-width: none !important;
    padding: max(4px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(4px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)) !important;
    gap: 5px !important;
  }

  body.is-fullscreen .controls {
    padding: 4px 10px !important;
    gap: 6px 10px !important;
    border-radius: 12px !important;
  }

  body.is-fullscreen .legend-group,
  body.is-fullscreen .speed-group,
  body.is-fullscreen #toggle-extra,
  body.is-fullscreen .lbl {
    display: none !important;
  }

  body.is-fullscreen .transport-group {
    flex: 0 0 auto !important;
  }

  body.is-fullscreen .seek-group {
    flex: 1 1 120px !important;
  }

  body.is-fullscreen #play,
  body.is-fullscreen #stop,
  body.is-fullscreen #toggle-ukulele,
  body.is-fullscreen #toggle-violin,
  body.is-fullscreen #fs {
    min-height: 30px !important;
    padding: 3px 9px !important;
    font-size: 12.5px !important;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(15, 23, 42, 0.05);
  }

  /* ============ Barra superior de controles ============ */
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 10px;
    align-items: center;
    padding: 8px 14px;
    flex-shrink: 0;
  }

  .group {
    display: flex;
    gap: 7px;
    align-items: center;
  }

  .transport-group {
    flex: 0 0 auto;
  }

  .speed-group {
    flex: 1 1 145px;
    max-width: 210px;
    min-width: 0;
  }

  .legend-group {
    flex: 0 0 auto;
    gap: 6px;
  }

  .seek-group {
    flex: 1 1 180px;
    min-width: 0;
  }

  .actions-right {
    display: flex;
    gap: 6px;
    align-items: center;
    margin-left: auto;
  }

  .lbl {
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    white-space: nowrap;
  }

  .hand-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 9px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 800;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--fg);
    white-space: nowrap;
  }

  .swatch {
    width: 11px;
    height: 11px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  .swatch.lh {
    background: var(--lh-fill);
    border: 1.5px solid var(--lh-border);
  }

  .swatch.rh {
    background: var(--rh-fill);
    border: 1.5px solid var(--rh-border);
  }

  button {
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    min-height: 34px;
    padding: 5px 11px;
    border-radius: 10px;
    cursor: pointer;
    touch-action: manipulation;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    white-space: nowrap;
    transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
  }

  button:active {
    transform: translateY(1px);
  }

  button:focus-visible,
  input:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
  }

  #play {
    background: var(--primary);
    color: #FFFFFF;
    border: none;
    padding: 5px 15px;
    box-shadow: 0 2px 8px rgba(79, 70, 229, 0.28);
  }

  #play:hover {
    background: var(--primary-hover);
    box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
  }

  .btn-sec {
    background: var(--surface);
    color: var(--fg);
    border: 1px solid var(--border);
  }

  .btn-sec:hover {
    background: #F1F5F9;
    border-color: #CBD5E1;
  }

  /* Botón opcional de Ukelele */
  #toggle-ukulele {
    background: var(--surface);
    color: var(--fg);
    border: 1.5px solid var(--border);
  }

  #toggle-ukulele:hover {
    background: var(--uke-bg);
    border-color: var(--uke-border);
    color: var(--uke-accent);
  }

  #toggle-ukulele[aria-pressed="true"] {
    background: var(--uke-accent);
    color: #FFFFFF;
    border-color: var(--uke-accent);
    box-shadow: 0 2px 8px rgba(13, 148, 136, 0.28);
  }

  /* Botón opcional de pentagrama de Violín */
  #toggle-violin {
    background: var(--surface);
    color: var(--fg);
    border: 1.5px solid var(--border);
  }

  #toggle-violin:hover {
    background: var(--violin-bg);
    border-color: var(--violin-border);
    color: var(--violin-accent);
  }

  #toggle-violin[aria-pressed="true"] {
    background: var(--violin-accent);
    color: #FFFFFF;
    border-color: var(--violin-accent);
    box-shadow: 0 2px 8px rgba(124, 58, 237, 0.30);
  }

  #toggle-extra {
    display: none;
  }

  input[type=range] {
    flex: 1;
    min-width: 50px;
    height: 24px;
    accent-color: #4F46E5;
    cursor: pointer;
    margin: 0;
  }

  #speedv {
    min-width: 4ch;
    text-align: right;
    font-variant-numeric: tabular-nums;
    font-weight: 800;
    font-size: 13px;
    color: var(--fg);
  }

  #time {
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    min-width: 7.8ch;
    font-weight: 700;
    color: var(--muted);
  }

  /* ============ Tarjeta principal: Barra de Acordes + Ukelele + Synthesia ============ */
  .stage-card {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .chord-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 6px 16px;
    background: linear-gradient(180deg, #F8FAFC 0%, #FFFFFF 100%);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    min-height: 44px;
  }

  .chord-left {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .chord-tag {
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    background: var(--bg);
    padding: 3px 8px;
    border-radius: 6px;
    white-space: nowrap;
  }

  .chord-center {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex: 1;
  }

  #chord-current {
    font-size: 22px;
    font-weight: 900;
    color: var(--primary);
    letter-spacing: -0.02em;
    line-height: 1.1;
    padding: 2px 14px;
    border-radius: 10px;
    background: #EEF2FF;
    border: 1.5px solid #C7D2FE;
    transition: transform 0.12s ease, background-color 0.15s ease;
  }

  #chord-current.is-empty {
    color: var(--muted);
    background: var(--surface);
    border-color: var(--border);
    font-size: 15px;
    font-weight: 700;
  }

  #chord-root {
    font-size: 12px;
    font-weight: 800;
    color: #166534;
    background: #DCFCE7;
    border: 1px solid #86EFAC;
    padding: 3px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }

  #chord-root:empty {
    display: none;
  }

  .chord-right {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    white-space: nowrap;
  }

  #chord-next {
    font-weight: 800;
    color: var(--fg);
  }

  /* Contenedor horizontal: Recuadro de Ukelele (opcional) + Escenario Piano/Violín */
  .stage-body {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: row;
    width: 100%;
  }

  .ukulele-box {
    width: 186px;
    flex-shrink: 0;
    background: linear-gradient(180deg, #F8FAFC 0%, #F1F5F9 100%);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 8px 8px;
    gap: 5px;
    overflow-y: auto;
    user-select: none;
  }

  .ukulele-box.is-hidden {
    display: none;
  }

  .uke-top-info {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    width: 100%;
  }

  .uke-header {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--uke-accent);
    background: var(--uke-bg);
    border: 1px solid var(--uke-border);
    padding: 1px 8px;
    border-radius: 999px;
  }

  .uke-chord-title {
    font-size: 16px;
    font-weight: 900;
    color: var(--fg);
    text-align: center;
    line-height: 1.1;
  }

  .uke-diagram-wrap {
    width: 100%;
    max-width: 132px;
    background: #FFFFFF;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px 4px 2px;
    box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .uke-diagram-wrap svg {
    width: 100%;
    height: auto;
    display: block;
  }

  .uke-frets-pill {
    font-size: 11px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--primary);
    background: #EEF2FF;
    border: 1px solid #C7D2FE;
    padding: 1px 8px;
    border-radius: 999px;
    letter-spacing: 0.04em;
  }

  /* ============ Cuadrículas de Rasgueo (Parte 1 superior y Parte 2 inferior) ============ */
  .uke-strum-section {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-top: 2px;
  }

  .strum-card {
    width: 100%;
    background: #FFFFFF;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 4px 6px 5px;
    opacity: 0.56;
    transition: opacity 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
  }

  .strum-card.is-active-part {
    opacity: 1;
    border-color: var(--uke-accent);
    background: #FFFFFF;
    box-shadow: 0 3px 10px rgba(13, 148, 136, 0.14);
  }

  .strum-card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 9.5px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin-bottom: 2px;
    padding: 0 2px;
  }

  .strum-card.is-active-part .strum-card-head {
    color: var(--uke-accent);
  }

  .strum-grid-box {
    border: 1.5px solid #334155;
    border-radius: 6px;
    background: #F8FAFC;
    padding: 3px 2px;
  }

  .strum-card.is-active-part .strum-grid-box {
    border-color: #0F172A;
    background: #FFFFFF;
  }

  .strum-grid-box svg {
    width: 100%;
    height: auto;
    display: block;
    overflow: visible;
  }

  .strum-step-num {
    transition: fill 0.07s ease, stroke 0.07s ease;
  }

  .strum-step-text {
    transition: fill 0.07s ease;
  }

  .strum-step-arrow {
    transition: stroke 0.07s ease, fill 0.07s ease;
  }

  /* Pulso activo iluminado (1 -> 2 -> 3 -> 1) */
  .strum-step.is-lit .strum-step-num {
    fill: #F59E0B;
    stroke: #B45309;
    stroke-width: 2;
  }

  .strum-step.is-lit .strum-step-text {
    fill: #FFFFFF;
  }

  .strum-step.is-lit .strum-step-arrow {
    stroke: #D97706;
  }

  .strum-step.is-lit .strum-step-arrow-fill {
    fill: #D97706;
    stroke: #D97706;
  }

  main {
    flex: 1;
    min-width: 0;
    min-height: 0;
    position: relative;
  }

  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    background: #0F172A;
    touch-action: pan-y;
  }

  /* ============ Adaptación Móvil Vertical (Portrait) ============ */
  @media (max-width: 768px) {
    .app-shell {
      padding: max(6px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
      gap: 6px;
    }

    .controls {
      padding: 7px 10px;
      gap: 6px 8px;
      border-radius: 14px;
    }

    .transport-group {
      flex: 1 1 auto;
    }

    .transport-group #play {
      flex: 1;
    }

    #toggle-extra {
      display: inline-flex;
      padding: 5px 10px;
      font-size: 13px;
    }

    .controls.compact-mobile .speed-group,
    .controls.compact-mobile .legend-group {
      display: none;
    }

    .speed-group {
      flex: 1 1 100%;
      max-width: none;
    }

    .legend-group {
      flex: 1 1 auto;
    }

    .seek-group {
      flex: 1 1 100%;
    }

    .actions-right {
      margin-left: 0;
    }

    .fs-label {
      display: none;
    }

    #fs {
      padding: 5px 10px;
    }

    .stage-card {
      border-radius: 14px;
    }

    .chord-bar {
      padding: 5px 10px;
      min-height: 40px;
      gap: 6px;
    }

    .chord-tag {
      display: none;
    }

    #chord-current {
      font-size: 18px;
      padding: 2px 10px;
    }

    .chord-right {
      font-size: 12px;
    }

    .ukulele-box {
      width: 124px;
      padding: 6px 5px;
      gap: 4px;
    }

    .uke-chord-title {
      font-size: 13.5px;
    }

    .uke-frets-pill {
      font-size: 10.5px;
      padding: 1px 6px;
    }
  }

  /* ============ Adaptación Móvil Horizontal (Landscape) ============ */
  @media (max-height: 520px) and (orientation: landscape) {
    .app-shell {
      padding: max(4px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(4px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
      gap: 4px;
    }

    .controls {
      padding: 4px 8px;
      gap: 4px 8px;
      border-radius: 12px;
    }

    .controls.compact-mobile .speed-group,
    .controls.compact-mobile .legend-group {
      display: flex;
    }

    #toggle-extra,
    .lbl {
      display: none;
    }

    button {
      min-height: 28px;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 8px;
    }

    .hand-badge {
      padding: 2px 7px;
      font-size: 11px;
    }

    .speed-group {
      flex: 1 1 90px;
      max-width: 135px;
    }

    .seek-group {
      flex: 1 1 120px;
    }

    #time {
      font-size: 11px;
      min-width: 7ch;
    }

    input[type=range] {
      height: 18px;
      min-width: 45px;
    }

    .fs-label {
      display: none;
    }

    .stage-card {
      border-radius: 12px;
    }

    .chord-bar {
      padding: 2px 12px;
      min-height: 28px;
    }

    .chord-tag {
      display: none;
    }

    #chord-current {
      font-size: 14.5px;
      padding: 1px 8px;
    }

    #chord-root {
      font-size: 11px;
      padding: 1px 7px;
    }

    .chord-right {
      font-size: 11px;
    }

    .ukulele-box {
      width: 148px;
      padding: 3px 5px;
      gap: 2px;
      justify-content: flex-start;
    }

    .uke-header {
      display: none;
    }

    .uke-chord-title {
      font-size: 12px;
    }

    .uke-diagram-wrap {
      max-width: 74px;
      padding: 2px;
    }

    .uke-frets-pill {
      font-size: 9.5px;
      padding: 0 5px;
    }

    .uke-strum-section {
      gap: 3px;
      margin-top: 1px;
    }

    .strum-card {
      padding: 2px 4px;
      border-radius: 7px;
    }

    .strum-card-head {
      font-size: 8px;
      margin-bottom: 1px;
    }

    .strum-grid-box {
      padding: 1px 2px;
    }
  }
</style>
</head>
<body>

<script>
function initApp() {
  const el = id => document.getElementById(id);

  /* Detectar si está abierta como App instalada (PWA en pantalla de inicio) */
  const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  if (isStandalone) {
    document.body.classList.add("is-standalone");
  }

  /* ============================================================================
     0. DESBLOQUEO DE AUDIO EN MODO SILENCIO PARA IPHONE (SAFARI Y CHROME iOS)
     ============================================================================ */
  const iosSilenceBypassEl = el("ios-silence-bypass");

  function enableIosPlaybackSession() {
    try {
      if ("audioSession" in navigator && navigator.audioSession) {
        navigator.audioSession.type = "playback";
      }
    } catch (e) {}

    if (iosSilenceBypassEl) {
      try {
        iosSilenceBypassEl.volume = 0.01;
        const p = iosSilenceBypassEl.play();
        if (p && typeof p.catch === "function") p.catch(() => {});
      } catch (e) {}
    }
  }

  function pauseIosPlaybackSession() {
    if (iosSilenceBypassEl && !iosSilenceBypassEl.paused) {
      try {
        iosSilenceBypassEl.pause();
      } catch (e) {}
    }
  }

  /* ============================================================================
     1. CONFIGURACIÓN DE ARCHIVOS MIDI, PULSO Y CAMBIO DE PARTE
     ============================================================================ */
  const MIDI_FILES = {
    melody:     "./midis/melodiaprincipal.mid",
    piano:      "./midis/piano.mid",
    violin:     "./midis/violin.mid",
    violinAlt:  "./violin.mid",
    leftAlt:    "./midis/pianoizquierda.mid",
    rightAlt:   "./midis/pianoderecha.mid"
  };

  const PULSOS_POR_ACORDE = 3;
  const COMPAS_INICIO_PARTE_2 = null;
  const SEGUNDO_INICIO_PARTE_2 = 36.0;
  const NOTA_DIVISION = 60;

  const ACORDES_MANUALES = [
    // { compas: 1, pulso: 1, acorde: "Re menor" },
  ];

  const ACORDES_POR_FUNDAMENTAL = {
    2:  { nombre: "Re menor",  nota: "Re"  },
    5:  { nombre: "Fa Mayor",  nota: "Fa"  },
    7:  { nombre: "Sol menor", nota: "Sol" },
    0:  { nombre: "Do Mayor",  nota: "Do"  },
    9:  { nombre: "La 7",      nota: "La"  },
    10: { nombre: "Sib Mayor", nota: "Sib" },
    4:  { nombre: "Mi menor",  nota: "Mi"  }
  };

  const UKULELE_CHORDS = {
    "re menor":   { frets: [2, 2, 1, 0], fingers: [2, 3, 1, 0] },
    "dm":         { frets: [2, 2, 1, 0], fingers: [2, 3, 1, 0] },
    "fa mayor":   { frets: [2, 0, 1, 0], fingers: [2, 0, 1, 0] },
    "f":          { frets: [2, 0, 1, 0], fingers: [2, 0, 1, 0] },
    "sol menor":  { frets: [0, 2, 3, 1], fingers: [0, 2, 3, 1] },
    "gm":         { frets: [0, 2, 3, 1], fingers: [0, 2, 3, 1] },
    "do mayor":   { frets: [0, 0, 0, 3], fingers: [0, 0, 0, 3] },
    "c":          { frets: [0, 0, 0, 3], fingers: [0, 0, 0, 3] },
    "la 7":       { frets: [0, 1, 0, 0], fingers: [0, 1, 0, 0] },
    "a7":         { frets: [0, 1, 0, 0], fingers: [0, 1, 0, 0] },
    "la menor":   { frets: [2, 0, 0, 0], fingers: [2, 0, 0, 0] },
    "am":         { frets: [2, 0, 0, 0], fingers: [2, 0, 0, 0] },
    "sol mayor":  { frets: [0, 2, 3, 2], fingers: [0, 1, 3, 2] },
    "g":          { frets: [0, 2, 3, 2], fingers: [0, 1, 3, 2] },
    "re mayor":   { frets: [2, 2, 2, 0], fingers: [1, 2, 3, 0] },
    "d":          { frets: [2, 2, 2, 0], fingers: [1, 2, 3, 0] },
    "sib mayor":  { frets: [3, 2, 1, 1], fingers: [3, 2, 1, 1] },
    "bb":         { frets: [3, 2, 1, 1], fingers: [3, 2, 1, 1] },
    "mi menor":   { frets: [0, 4, 3, 2], fingers: [0, 3, 2, 1] },
    "em":         { frets: [0, 4, 3, 2], fingers: [0, 3, 2, 1] },
    "re 7":       { frets: [2, 2, 2, 3], fingers: [1, 1, 1, 2] },
    "d7":         { frets: [2, 2, 2, 3], fingers: [1, 1, 1, 2] },
    "sol 7":      { frets: [0, 2, 1, 2], fingers: [0, 2, 1, 3] },
    "g7":         { frets: [0, 2, 1, 2], fingers: [0, 2, 1, 3] },
    "do 7":       { frets: [0, 0, 0, 1], fingers: [0, 0, 0, 1] },
    "c7":         { frets: [0, 0, 0, 1], fingers: [0, 0, 0, 1] }
  };

  function renderUkuleleDiagram(chordName) {
    const cleanName = (chordName || "Re menor").trim();
    const shape = UKULELE_CHORDS[cleanName.toLowerCase()] || UKULELE_CHORDS["re menor"];
    const frets = shape.frets;
    const fingers = shape.fingers || [0, 0, 0, 0];

    el("uke-chord-name").textContent = cleanName;
    el("uke-frets-text").textContent = frets.map(f => (f < 0 ? "✕" : f)).join(" · ");

    const positiveFrets = frets.filter(f => f > 0);
    const maxFret = positiveFrets.length ? Math.max(...positiveFrets) : 3;
    const minFret = positiveFrets.length ? Math.min(...positiveFrets) : 1;
    const baseFret = maxFret > 4 ? minFret : 1;

    const stringNames = ["G", "C", "E", "A"];
    const startX = 28;
    const stepX = 25;
    const topY = 34;
    const fretH = 21;
    const numFrets = 4;
    const endX = startX + stepX * 3;
    const endY = topY + fretH * numFrets;

    let svg = `<svg viewBox="0 0 124 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Acorde ${cleanName} en ukelele: ${frets.join("-")}">`;

    for (let s = 0; s < 4; s++) {
      const x = startX + s * stepX;
      svg += `<text x="${x}" y="13" text-anchor="middle" font-family="Nunito, sans-serif" font-size="10.5" font-weight="800" fill="#64748B">${stringNames[s]}</text>`;
    }

    for (let s = 0; s < 4; s++) {
      const x = startX + s * stepX;
      const f = frets[s];
      if (f === 0) {
        svg += `<circle cx="${x}" cy="24" r="4" fill="none" stroke="#22C55E" stroke-width="1.8"/>`;
      } else if (f < 0) {
        svg += `<text x="${x}" y="28" text-anchor="middle" font-family="Nunito, sans-serif" font-size="11" font-weight="800" fill="#EF4444">✕</text>`;
      }
    }

    for (let f = 0; f <= numFrets; f++) {
      const y = topY + f * fretH;
      const isNut = (f === 0 && baseFret === 1);
      svg += `<line x1="${startX - 1}" y1="${y}" x2="${endX + 1}" y2="${y}" stroke="${isNut ? "#1E293B" : "#CBD5E1"}" stroke-width="${isNut ? 4 : 1.5}" stroke-linecap="round"/>`;
      if (f < numFrets) {
        const fretNum = baseFret + f;
        const labelY = y + fretH / 2 + 3.5;
        svg += `<text x="14" y="${labelY}" text-anchor="middle" font-family="Nunito, sans-serif" font-size="10" font-weight="700" fill="#94A3B8">${fretNum}</text>`;
      }
    }

    for (let s = 0; s < 4; s++) {
      const x = startX + s * stepX;
      svg += `<line x1="${x}" y1="${topY}" x2="${x}" y2="${endY}" stroke="#64748B" stroke-width="${1.8 - s * 0.15}"/>`;
    }

    for (let s = 0; s < 4; s++) {
      const f = frets[s];
      if (f > 0) {
        const relFret = f - baseFret + 1;
        if (relFret >= 1 && relFret <= numFrets) {
          const cx = startX + s * stepX;
          const cy = topY + (relFret - 0.5) * fretH;
          const finger = fingers[s];
          svg += `<circle cx="${cx}" cy="${cy}" r="8" fill="#4F46E5" stroke="#FFFFFF" stroke-width="1.4"/>`;
          if (finger > 0) {
            svg += `<text x="${cx}" y="${cy + 3.3}" text-anchor="middle" font-family="Nunito, sans-serif" font-size="9.5" font-weight="800" fill="#FFFFFF">${finger}</text>`;
          }
        }
      }
    }

    svg += `</svg>`;
    el("uke-diagram").innerHTML = svg;
  }

  renderUkuleleDiagram("Re menor");

  /* ============================================================================
     2. RANGO DEL PIANO: DE A2 (45) A B4 (71)
     ============================================================================ */
  const MIN_MIDI = 45;
  const MAX_MIDI = 71;
  const NOTE_NAMES_ES = ["Do", "Do#", "Re", "Mib", "Mi", "Fa", "Fa#", "Sol", "Sol#", "La", "Sib", "Si"];
  const BLACK_PCS = new Set([1, 3, 6, 8, 10]);

  const PIANO_KEYS = [];
  const WHITE_KEYS = [];
  const BLACK_KEYS = [];
  const KEY_BY_MIDI = {};

  for (let m = MIN_MIDI; m <= MAX_MIDI; m++) {
    const pc = m % 12;
    const octave = Math.floor(m / 12) - 1;
    const isBlack = BLACK_PCS.has(pc);
    const labelEs = NOTE_NAMES_ES[pc] + (pc === 0 || m === MIN_MIDI || m === MAX_MIDI ? octave : "");
    const keyObj = {
      midi: m,
      pc,
      octave,
      isBlack,
      label: labelEs,
      whiteIndex: WHITE_KEYS.length,
      x: 0,
      w: 0,
      h: 0
    };
    PIANO_KEYS.push(keyObj);
    KEY_BY_MIDI[m] = keyObj;
    if (isBlack) {
      BLACK_KEYS.push(keyObj);
    } else {
      WHITE_KEYS.push(keyObj);
    }
  }

  /* ============================================================================
     3. SONIDO REAL DE PIANO, VOZ/MELODÍA Y VIOLÍN SIN SATURACIÓN (<= 0 dB)
     ============================================================================ */
  let violinMode = false;
  let ukuleleMode = false;

  const masterLimiter = new Tone.Limiter(-1).toDestination();

  const roomReverb = new Tone.Reverb({
    decay: 1.4,
    preDelay: 0.01,
    wet: 0.16
  }).connect(masterLimiter);

  const pianoFallbackFilter = new Tone.Filter({
    type: "lowpass",
    frequency: 2600,
    Q: 0.7
  }).connect(roomReverb);

  const pianoFallbackSynth = new Tone.PolySynth(Tone.Synth, {
    oscillator: {
      type: "custom",
      partials: [1, 0.55, 0.28, 0.16, 0.08, 0.04, 0.015]
    },
    envelope: {
      attack: 0.006,
      decay: 0.65,
      sustain: 0.18,
      release: 0.45
    }
  }).connect(pianoFallbackFilter);

  let pianoSamplerLoaded = false;
  const pianoSampler = new Tone.Sampler({
    urls: {
      "A1": "A1.mp3",
      "C2": "C2.mp3",
      "D#2": "D%232.mp3",
      "F#2": "F%232.mp3",
      "A2": "A2.mp3",
      "C3": "C3.mp3",
      "D#3": "D%233.mp3",
      "F#3": "F%233.mp3",
      "A3": "A3.mp3",
      "C4": "C4.mp3",
      "D#4": "D%234.mp3",
      "F#4": "F%234.mp3",
      "A4": "A4.mp3",
      "C5": "C5.mp3"
    },
    release: 0.55,
    baseUrl: "https://tonejs.github.io/audio/salamander/",
    onload: () => {
      pianoSamplerLoaded = true;
    },
    onerror: () => {
      pianoSamplerLoaded = false;
    }
  }).connect(roomReverb);

  function triggerPianoNote(midi, durSec, time, vel) {
    const freqOrNote = Tone.Frequency(midi, "midi").toNote();
    if (pianoSamplerLoaded) {
      pianoSampler.triggerAttackRelease(freqOrNote, durSec, time, vel);
    } else {
      pianoFallbackSynth.triggerAttackRelease(freqOrNote, durSec, time, vel);
    }
  }

  function releaseAllPiano() {
    try { pianoSampler.releaseAll(); } catch (e) {}
    try { pianoFallbackSynth.releaseAll(); } catch (e) {}
  }

  const vibrato = new Tone.Vibrato(4.5, 0.05).connect(roomReverb);
  const melodySynth = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "custom", partials: [1, 0.22, 0.05] },
    envelope: { attack: 0.04, decay: 0.12, sustain: 0.80, release: 0.18 }
  }).connect(vibrato);

  const violinFilter = new Tone.Filter({
    type: "lowpass",
    frequency: 3000,
    Q: 0.85
  }).connect(roomReverb);

  const violinVibrato = new Tone.Vibrato(5.0, 0.055).connect(violinFilter);

  const violin1Synth = new Tone.PolySynth(Tone.Synth, {
    oscillator: {
      type: "custom",
      partials: [1, 0.72, 0.50, 0.34, 0.20, 0.11, 0.05]
    },
    envelope: {
      attack: 0.08,
      decay: 0.15,
      sustain: 0.82,
      release: 0.25
    }
  }).connect(violinVibrato);

  const violin2Synth = new Tone.PolySynth(Tone.Synth, {
    oscillator: {
      type: "custom",
      partials: [1, 0.76, 0.55, 0.38, 0.24, 0.14, 0.07]
    },
    envelope: {
      attack: 0.075,
      decay: 0.15,
      sustain: 0.85,
      release: 0.25
    }
  }).connect(violinVibrato);

  function releaseAllViolin() {
    try { violin1Synth.releaseAll(); } catch (e) {}
    try { violin2Synth.releaseAll(); } catch (e) {}
  }

  function updateAudioMix() {
    if (violinMode) {
      pianoSampler.volume.value = -5;
      pianoFallbackSynth.volume.value = -10;
      melodySynth.volume.value = -19;
      violin1Synth.volume.value = -6;
      violin2Synth.volume.value = -3;
    } else {
      pianoSampler.volume.value = 0;
      pianoFallbackSynth.volume.value = -5;
      melodySynth.volume.value = -8;
      violin1Synth.volume.value = -Infinity;
      violin2Synth.volume.value = -Infinity;
      releaseAllViolin();
    }
  }

  updateAudioMix();

  const clickSynth = new Tone.MembraneSynth({
    pitchDecay: 0.008,
    octaves: 2,
    envelope: { attack: 0.001, decay: 0.07, sustain: 0, release: 0.01 }
  }).connect(masterLimiter);
  clickSynth.volume.value = -13;

  /* ============================================================================
     4. CARGA DE MIDIS Y SINCRONIZACIÓN EXACTA CON EL PULSO DEL PIANO
     ============================================================================ */
  let song = {
    leftNotes: [],
    rightNotes: [],
    melodyNotes: [],
    violinNotes: [],
    hasViolinMidi: false,
    chords: [],
    pulseStepBeats: 1,
    pulseAnchorBeat: 3,
    pianoAttacks: [],
    part2StartBeat: 63,
    bpm: 100,
    num: 3,
    lead: 3,
    endBeat: 1,
    loaded: false
  };
  let speed = 1;
  let posTicks = 0;

  async function fetchMidiFile(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`No se pudo cargar ${url}`);
    const buf = await res.arrayBuffer();
    const MidiClass = (window.Midi && window.Midi.Midi) || window.Midi;
    return new MidiClass(buf);
  }

  function extractRawNotes(midiObj) {
    const out = [];
    if (!midiObj) return out;
    const ppq = midiObj.header.ppq || 480;
    midiObj.tracks.forEach(tr => {
      if (tr.instrument && tr.instrument.percussion) return;
      tr.notes.forEach(n => {
        out.push({
          midi: n.midi,
          startBeatRaw: n.ticks / ppq,
          durBeats: Math.max(0.08, n.durationTicks / ppq),
          vel: n.velocity || 0.8
        });
      });
    });
    return out.sort((a, b) => a.startBeatRaw - b.startBeatRaw);
  }

  function extractViolinRawNotes(violinMidi) {
    const out = [];
    if (!violinMidi) return out;
    const ppq = violinMidi.header.ppq || 480;
    const validTracks = violinMidi.tracks.filter(
      tr => (!tr.instrument || !tr.instrument.percussion) && tr.notes.length > 0
    );

    validTracks.forEach((tr, trackIdx) => {
      const voice = validTracks.length === 1 ? 2 : (trackIdx === 0 ? 1 : 2);
      tr.notes.forEach(n => {
        out.push({
          midi: n.midi,
          voice,
          startBeatRaw: n.ticks / ppq,
          durBeats: Math.max(0.08, n.durationTicks / ppq),
          vel: n.velocity || 0.8
        });
      });
    });

    return out.sort((a, b) => a.startBeatRaw - b.startBeatRaw);
  }

  function splitPianoHands(pianoMidi) {
    if (!pianoMidi) return { leftRaw: [], rightRaw: [] };
    const ppq = pianoMidi.header.ppq || 480;

    const validTracks = pianoMidi.tracks
      .filter(tr => (!tr.instrument || !tr.instrument.percussion) && tr.notes.length > 0)
      .map((tr, idx) => {
        const notes = tr.notes.map(n => ({
          midi: n.midi,
          channel: tr.channel || 0,
          startBeatRaw: n.ticks / ppq,
          durBeats: Math.max(0.08, n.durationTicks / ppq),
          vel: n.velocity || 0.8
        }));
        const avgPitch = notes.reduce((acc, n) => acc + n.midi, 0) / notes.length;
        return { idx, notes, avgPitch };
      });

    if (!validTracks.length) return { leftRaw: [], rightRaw: [] };

    if (validTracks.length >= 2) {
      validTracks.sort((a, b) => {
        if (Math.abs(a.avgPitch - b.avgPitch) > 0.5) return a.avgPitch - b.avgPitch;
        return b.idx - a.idx;
      });
      const leftRaw = validTracks[0].notes.sort((a, b) => a.startBeatRaw - b.startBeatRaw);
      const rightRaw = validTracks
        .slice(1)
        .flatMap(t => t.notes)
        .sort((a, b) => a.startBeatRaw - b.startBeatRaw);
      return { leftRaw, rightRaw };
    }

    const singleNotes = validTracks[0].notes;
    const channels = [...new Set(singleNotes.map(n => n.channel))];
    if (channels.length >= 2) {
      const byChannel = channels.map(ch => {
        const chNotes = singleNotes.filter(n => n.channel === ch);
        const avg = chNotes.reduce((acc, n) => acc + n.midi, 0) / chNotes.length;
        return { chNotes, avg };
      }).sort((a, b) => a.avg - b.avg);

      return {
        leftRaw: byChannel[0].chNotes.sort((a, b) => a.startBeatRaw - b.startBeatRaw),
        rightRaw: byChannel.slice(1).flatMap(c => c.chNotes).sort((a, b) => a.startBeatRaw - b.startBeatRaw)
      };
    }

    const leftRaw = [];
    const rightRaw = [];
    for (const n of singleNotes) {
      if (n.midi < NOTA_DIVISION) {
        leftRaw.push(n);
      } else {
        rightRaw.push(n);
      }
    }
    return {
      leftRaw: leftRaw.sort((a, b) => a.startBeatRaw - b.startBeatRaw),
      rightRaw: rightRaw.sort((a, b) => a.startBeatRaw - b.startBeatRaw)
    };
  }

  function analyzePianoRhythm(leftNotes, rightNotes, tsDenom, leadBeats) {
    const pianoAll = [...leftNotes, ...rightNotes].sort((a, b) => a.startBeat - b.startBeat);
    const attacks = [];

    for (const n of pianoAll) {
      const last = attacks[attacks.length - 1];
      if (last && Math.abs(n.startBeat - last.beat) <= 0.055) {
        last.notes.push(n);
        if (n.midi < last.lowestMidi) last.lowestMidi = n.midi;
      } else {
        attacks.push({
          beat: n.startBeat,
          notes: [n],
          lowestMidi: n.midi
        });
      }
    }

    if (!attacks.length) {
      const defaultStep = tsDenom === 8 ? 0.5 : 1.0;
      return {
        attacks: [],
        pulseStepBeats: defaultStep,
        pulseAnchorBeat: leadBeats
      };
    }

    const diffs = [];
    const limit = Math.min(attacks.length - 1, 36);
    for (let i = 0; i < limit; i++) {
      const d = attacks[i + 1].beat - attacks[i].beat;
      if (d >= 0.22 && d <= 1.35) {
        diffs.push(d);
      }
    }

    let pulseStepBeats = tsDenom === 8 ? 0.5 : 1.0;
    if (diffs.length >= 3) {
      diffs.sort((a, b) => a - b);
      const medianDiff = diffs[Math.floor(diffs.length / 2)];
      if (medianDiff < 0.72) {
        pulseStepBeats = 0.5;
      } else {
        pulseStepBeats = 1.0;
      }
    }

    const pulseAnchorBeat = attacks[0].beat;
    return { attacks, pulseStepBeats, pulseAnchorBeat };
  }

  function detectPart2StartBeat(attacks, pulseStepBeats, pulseAnchorBeat, bpm) {
    const spb = 60 / bpm;
    const measureBeats = PULSOS_POR_ACORDE * pulseStepBeats;

    if (typeof COMPAS_INICIO_PARTE_2 === "number" && COMPAS_INICIO_PARTE_2 >= 1) {
      return pulseAnchorBeat + (COMPAS_INICIO_PARTE_2 - 1) * measureBeats;
    }

    const targetBeat = SEGUNDO_INICIO_PARTE_2 / spb;
    const approxIdx = Math.max(1, Math.round((targetBeat - pulseAnchorBeat) / measureBeats));
    const fallbackBeat = pulseAnchorBeat + approxIdx * measureBeats;

    if (!attacks.length) return fallbackBeat;

    const minBeatSearch = 34.0 / spb;
    const maxBeatSearch = 39.5 / spb;
    const startIdx = Math.max(1, Math.floor((minBeatSearch - pulseAnchorBeat) / measureBeats));
    const endIdx   = Math.ceil((maxBeatSearch - pulseAnchorBeat) / measureBeats);

    let bestCandidate = null;
    let bestDistance = Infinity;

    for (let idx = startIdx; idx <= endIdx; idx++) {
      const mStart = pulseAnchorBeat + idx * measureBeats;
      if (mStart < minBeatSearch || mStart > maxBeatSearch) continue;

      const p1 = attacks.find(a => Math.abs(a.beat - mStart) <= pulseStepBeats * 0.35);
      const p2 = attacks.find(a => Math.abs(a.beat - (mStart + pulseStepBeats)) <= pulseStepBeats * 0.35);
      const p3 = attacks.find(a => Math.abs(a.beat - (mStart + 2 * pulseStepBeats)) <= pulseStepBeats * 0.35);

      const isBlockChordOn2 = p1 && p2 && p2.notes.length >= 3;
      const isRestOn3 = p1 && p2 && !p3;

      if (isBlockChordOn2 || isRestOn3) {
        const dist = Math.abs(mStart - targetBeat);
        if (dist < bestDistance) {
          bestDistance = dist;
          bestCandidate = p1 ? p1.beat : mStart;
        }
      }
    }

    return bestCandidate !== null ? bestCandidate : fallbackBeat;
  }

  function buildChordTimeline(attacks, pulseStepBeats, pulseAnchorBeat) {
    const measureBeats = PULSOS_POR_ACORDE * pulseStepBeats;

    if (ACORDES_MANUALES.length > 0) {
      const timeline = [];
      let lastChordName = "";
      const sortedManual = [...ACORDES_MANUALES].sort((a, b) => {
        const beatA = (Math.max(1, a.compas || 1) - 1) * measureBeats + (Math.max(1, a.pulso || 1) - 1) * pulseStepBeats;
        const beatB = (Math.max(1, b.compas || 1) - 1) * measureBeats + (Math.max(1, b.pulso || 1) - 1) * pulseStepBeats;
        return beatA - beatB;
      });

      for (const item of sortedManual) {
        const compas = Math.max(1, item.compas || 1);
        const pulso = Math.max(1, item.pulso || 1);
        const beat = pulseAnchorBeat + (compas - 1) * measureBeats + (pulso - 1) * pulseStepBeats;
        const nombre = item.acorde.trim();
        if (nombre && nombre !== lastChordName) {
          const foundEntry = Object.values(ACORDES_POR_FUNDAMENTAL).find(
            c => c.nombre.toLowerCase() === nombre.toLowerCase()
          );
          timeline.push({
            startBeat: beat,
            nombre,
            nota: foundEntry ? foundEntry.nota : ""
          });
          lastChordName = nombre;
        }
      }
      return timeline;
    }

    if (!attacks.length) return [];

    const blocks = new Map();
    for (const att of attacks) {
      const relBeat = Math.max(0, att.beat - pulseAnchorBeat);
      const blockIdx = Math.floor((relBeat + pulseStepBeats * 0.25) / measureBeats);

      if (!blocks.has(blockIdx)) {
        blocks.set(blockIdx, {
          blockIdx,
          firstBeat: att.beat,
          lowestMidi: att.lowestMidi
        });
      }
    }

    const sortedBlocks = [...blocks.values()].sort((a, b) => a.blockIdx - b.blockIdx);
    const timeline = [];
    let lastChordName = "";

    for (const blk of sortedBlocks) {
      const pc = ((blk.lowestMidi % 12) + 12) % 12;
      const chordInfo = ACORDES_POR_FUNDAMENTAL[pc];
      if (chordInfo && chordInfo.nombre !== lastChordName) {
        timeline.push({
          startBeat: blk.firstBeat,
          nombre: chordInfo.nombre,
          nota: chordInfo.nota
        });
        lastChordName = chordInfo.nombre;
      }
    }

    return timeline;
  }

  function setupSongData(melodyMidi, pianoMidi, violinMidi, leftAltMidi, rightAltMidi) {
    resetPlayback();
    const T = Tone.Transport;
    T.cancel();
    const ppq = 480;
    T.PPQ = ppq;

    const refMidi = pianoMidi || melodyMidi || violinMidi || rightAltMidi || leftAltMidi;
    const bpm = (refMidi && refMidi.header.tempos.length) ? refMidi.header.tempos[0].bpm : 100;
    const ts = (refMidi && refMidi.header.timeSignatures.length)
      ? refMidi.header.timeSignatures[0].timeSignature
      : [3, 4];
    const num = ts[0] || 3;
    const denom = ts[1] || 4;
    const lead = 3;

    let leftRaw = [];
    let rightRaw = [];

    if (pianoMidi) {
      const split = splitPianoHands(pianoMidi);
      leftRaw = split.leftRaw;
      rightRaw = split.rightRaw;
    } else {
      leftRaw = extractRawNotes(leftAltMidi);
      rightRaw = extractRawNotes(rightAltMidi);
    }

    const melodyRaw = extractRawNotes(melodyMidi);
    const violinRaw = extractViolinRawNotes(violinMidi);

    const mapHandNotes = (rawList, hand) => rawList.map(n => ({
      midi: n.midi,
      displayMidi: n.midi,
      voice: n.voice || 1,
      hand,
      startBeat: n.startBeatRaw + lead,
      durBeats: n.durBeats,
      vel: n.vel
    }));

    const melodyNotes = mapHandNotes(melodyRaw, "melody");
    const leftNotes   = mapHandNotes(leftRaw,   "left");
    const rightNotes  = mapHandNotes(rightRaw,  "right");
    const violinNotes = mapHandNotes(violinRaw, "violin");

    const { attacks, pulseStepBeats, pulseAnchorBeat } = analyzePianoRhythm(
      leftNotes,
      rightNotes,
      denom,
      lead
    );

    const chords = buildChordTimeline(attacks, pulseStepBeats, pulseAnchorBeat);
    const part2StartBeat = detectPart2StartBeat(attacks, pulseStepBeats, pulseAnchorBeat, bpm);

    const allNotes = [...melodyNotes, ...leftNotes, ...rightNotes, ...violinNotes];
    const maxBeat = allNotes.reduce((acc, n) => Math.max(acc, n.startBeat + n.durBeats), lead + 3);

    song = {
      melodyNotes,
      leftNotes,
      rightNotes,
      violinNotes,
      hasViolinMidi: violinNotes.length > 0,
      chords,
      pulseStepBeats,
      pulseAnchorBeat,
      pianoAttacks: attacks,
      part2StartBeat,
      bpm,
      num,
      lead,
      endBeat: maxBeat + 1.5,
      loaded: allNotes.length > 0
    };

    melodyNotes.forEach(n => {
      const startTicks = Math.round(n.startBeat * ppq);
      const durTicks = Math.max(24, Math.round(n.durBeats * ppq * 0.94));
      T.schedule(time => {
        const dSec = Math.max(new Tone.Ticks(durTicks).toSeconds(), 0.08);
        melodySynth.triggerAttackRelease(Tone.Frequency(n.midi, "midi").toFrequency(), dSec, time, n.vel * 0.80);
      }, startTicks + "i");
    });

    [...leftNotes, ...rightNotes].forEach(n => {
      const startTicks = Math.round(n.startBeat * ppq);
      const durTicks = Math.max(24, Math.round(n.durBeats * ppq * 0.94));
      T.schedule(time => {
        const dSec = Math.max(new Tone.Ticks(durTicks).toSeconds(), 0.10);
        triggerPianoNote(n.midi, dSec, time, n.vel * 0.90);
      }, startTicks + "i");
    });

    violinNotes.forEach(n => {
      const startTicks = Math.round(n.startBeat * ppq);
      const durTicks = Math.max(24, Math.round(n.durBeats * ppq * 0.96));
      T.schedule(time => {
        if (!violinMode) return;
        const dSec = Math.max(new Tone.Ticks(durTicks).toSeconds(), 0.10);
        const freq = Tone.Frequency(n.midi, "midi").toFrequency();
        if (n.voice === 2) {
          violin2Synth.triggerAttackRelease(freq, dSec, time, Math.min(0.86, n.vel * 0.85));
        } else {
          violin1Synth.triggerAttackRelease(freq, dSec, time, Math.min(0.75, n.vel * 0.72));
        }
      }, startTicks + "i");
    });

    T.scheduleRepeat(time => {
      const b = Math.round(T.getTicksAtTime(time) / ppq);
      if (b < lead) {
        clickSynth.triggerAttackRelease(b === 0 ? "C3" : "G2", "32n", time);
      }
    }, "4n");

    T.bpm.value = bpm * speed;
    el("seek").max = song.endBeat;
    el("seek").value = 0;
    updateChordDisplay(0);
    updateStrummingAnimation(0, false);
  }

  async function loadAllMidis() {
    const [melRes, pianoRes, violinRes] = await Promise.allSettled([
      fetchMidiFile(MIDI_FILES.melody),
      fetchMidiFile(MIDI_FILES.piano),
      fetchMidiFile(MIDI_FILES.violin)
    ]);

    const melodyMidi = melRes.status === "fulfilled" ? melRes.value : null;
    const pianoMidi  = pianoRes.status === "fulfilled" ? pianoRes.value : null;
    let violinMidi   = violinRes.status === "fulfilled" ? violinRes.value : null;

    if (!violinMidi) {
      try {
        violinMidi = await fetchMidiFile(MIDI_FILES.violinAlt);
      } catch (e) {
        violinMidi = null;
      }
    }

    let leftAltMidi = null;
    let rightAltMidi = null;

    if (!pianoMidi) {
      const [lRes, rRes] = await Promise.allSettled([
        fetchMidiFile(MIDI_FILES.leftAlt),
        fetchMidiFile(MIDI_FILES.rightAlt)
      ]);
      leftAltMidi  = lRes.status === "fulfilled" ? lRes.value : null;
      rightAltMidi = rRes.status === "fulfilled" ? rRes.value : null;
    }

    if (!melodyMidi && !pianoMidi && !violinMidi && !leftAltMidi && !rightAltMidi) {
      el("chord-current").textContent = "Falta ./midis/piano.mid";
      el("chord-current").classList.add("is-empty");
      return;
    }

    setupSongData(melodyMidi, pianoMidi, violinMidi, leftAltMidi, rightAltMidi);
  }

  /* ============================================================================
     5. BARRA DE ACORDES + PULSO DE UKELELE SINCRONIZADO CON EL PIANO (1 - 2 - 3)
     ============================================================================ */
  let lastRenderedChord = "";
  let lastStrumState = "";

  function updateStrummingAnimation(beat, isPlaying) {
    const stepBeats = song.pulseStepBeats || 1;
    const anchorBeat = song.pulseAnchorBeat ?? song.lead;
    const isPart2 = beat >= (song.part2StartBeat - stepBeats * 0.12);
    const activePartNum = isPart2 ? 2 : 1;

    let pulseNum = 0;
    if (isPlaying) {
      const relSteps = (beat - anchorBeat + stepBeats * 0.08) / stepBeats;
      const stepIdx = ((Math.floor(relSteps) % PULSOS_POR_ACORDE) + PULSOS_POR_ACORDE) % PULSOS_POR_ACORDE;
      pulseNum = stepIdx + 1;
    }

    const stateKey = `${activePartNum}:${pulseNum}`;
    if (lastStrumState === stateKey) return;
    lastStrumState = stateKey;

    const card1 = el("strum-part-1");
    const card2 = el("strum-part-2");
    if (card1 && card2) {
      card1.classList.toggle("is-active-part", activePartNum === 1);
      card2.classList.toggle("is-active-part", activePartNum === 2);
    }

    for (let p = 1; p <= 2; p++) {
      for (let step = 1; step <= 3; step++) {
        const node = el(`p${p}-step-${step}`);
        if (node) {
          node.classList.toggle("is-lit", p === activePartNum && step === pulseNum);
        }
      }
    }
  }

  function updateChordDisplay(beat) {
    const curEl = el("chord-current");
    const rootEl = el("chord-root");
    const nextEl = el("chord-next");

    if (!song.chords.length) {
      if (song.loaded) {
        curEl.textContent = "Re menor";
        curEl.classList.remove("is-empty");
        rootEl.textContent = "Base: Re";
        renderUkuleleDiagram("Re menor");
      }
      nextEl.textContent = "—";
      return;
    }

    let activeIdx = -1;
    for (let i = 0; i < song.chords.length; i++) {
      if (beat >= song.chords[i].startBeat - 0.04) {
        activeIdx = i;
      } else {
        break;
      }
    }

    if (activeIdx === -1) {
      const first = song.chords[0];
      const keyStr = "prep:" + first.nombre;
      if (lastRenderedChord !== keyStr) {
        lastRenderedChord = keyStr;
        curEl.textContent = first.nombre;
        curEl.classList.remove("is-empty");
        rootEl.textContent = first.nota ? `Prepárate · Base: ${first.nota}` : "Prepárate";
        nextEl.textContent = song.chords[1] ? song.chords[1].nombre : "—";
        renderUkuleleDiagram(first.nombre);
      }
      return;
    }

    const current = song.chords[activeIdx];
    const next = song.chords[activeIdx + 1];
    const keyStr = activeIdx + ":" + current.nombre;

    if (lastRenderedChord !== keyStr) {
      lastRenderedChord = keyStr;
      curEl.textContent = current.nombre;
      curEl.classList.remove("is-empty");
      rootEl.textContent = current.nota ? `Base: ${current.nota}` : "";
      nextEl.textContent = next ? next.nombre : "Final";
      renderUkuleleDiagram(current.nombre);

      curEl.style.transform = "scale(1.05)";
      setTimeout(() => { curEl.style.transform = "scale(1)"; }, 130);
    }
  }

  /* ============================================================================
     6. CONTROLES DE REPRODUCCIÓN, UKELELE, VIOLÍN, VELOCIDAD Y EXPANSIÓN
     ============================================================================ */
  const ticksNow = () => Tone.Transport.getTicksAtTime(Tone.getContext().currentTime);
  const getBeat = () => (Tone.Transport.state === "started" ? ticksNow() : posTicks) / Tone.Transport.PPQ;

  function setPlayButtonState(playing) {
    el("play").innerHTML = playing
      ? '<span aria-hidden="true">⏸</span> Pausa'
      : '<span aria-hidden="true">▶</span> Iniciar';
  }

  function resetPlayback() {
    Tone.Transport.stop();
    posTicks = 0;
    melodySynth.releaseAll();
    releaseAllPiano();
    releaseAllViolin();
    pauseIosPlaybackSession();
    setPlayButtonState(false);
    el("seek").value = 0;
    lastRenderedChord = "";
    lastStrumState = "";
    updateChordDisplay(0);
    updateStrummingAnimation(0, false);
  }

  el("play").addEventListener("click", async () => {
    enableIosPlaybackSession();
    await Tone.start();
    const T = Tone.Transport;
    if (T.state === "started") {
      posTicks = ticksNow();
      T.pause();
      melodySynth.releaseAll();
      releaseAllPiano();
      releaseAllViolin();
      pauseIosPlaybackSession();
      setPlayButtonState(false);
    } else {
      if (posTicks / T.PPQ >= song.endBeat - 0.01) posTicks = 0;
      T.start(undefined, Math.round(posTicks) + "i");
      setPlayButtonState(true);
      // Sugerir colapso de barra del navegador en móvil al iniciar
      if (window.scrollY < 10) {
        window.scrollTo({ top: 44, behavior: "smooth" });
      }
    }
  });

  el("stop").addEventListener("click", resetPlayback);

  const ukeBtn = el("toggle-ukulele");
  const ukePanel = el("ukulele-panel");
  ukeBtn.addEventListener("click", () => {
    ukuleleMode = !ukuleleMode;
    ukeBtn.setAttribute("aria-pressed", String(ukuleleMode));
    ukePanel.classList.toggle("is-hidden", !ukuleleMode);
    requestAnimationFrame(resize);
  });

  const violinBtn = el("toggle-violin");
  violinBtn.addEventListener("click", async () => {
    enableIosPlaybackSession();
    await Tone.start();
    violinMode = !violinMode;
    violinBtn.setAttribute("aria-pressed", String(violinMode));
    updateAudioMix();
    computeLayout();
  });

  el("speed").addEventListener("input", e => {
    const v = parseInt(e.target.value, 10);
    speed = v / 100;
    el("speedv").textContent = v + "%";
    Tone.Transport.bpm.value = song.bpm * speed;
  });

  const controlsBar = el("controls-bar");
  const toggleExtraBtn = el("toggle-extra");
  toggleExtraBtn.addEventListener("click", () => {
    const compact = controlsBar.classList.toggle("compact-mobile");
    toggleExtraBtn.setAttribute("aria-expanded", String(!compact));
    toggleExtraBtn.textContent = compact ? "Ajustes ▾" : "Ajustes ▴";
    requestAnimationFrame(resize);
  });

  function updateFsButton(active) {
    el("fs").innerHTML = active
      ? '<span aria-hidden="true">✕</span><span class="fs-label">Normal</span>'
      : '<span aria-hidden="true">⛶</span><span class="fs-label">Expandir</span>';
  }

  function enterStudyFullscreen() {
    document.body.classList.add("is-fullscreen");
    updateFsButton(true);
    window.scrollTo({ top: 60, behavior: "smooth" });
    setTimeout(resize, 80);
  }

  function exitStudyFullscreen() {
    document.body.classList.remove("is-fullscreen");
    updateFsButton(false);
    setTimeout(resize, 80);
  }

  function toggleFullscreen() {
    const nativeFS = document.fullscreenElement || document.webkitFullscreenElement;
    const cssFS = document.body.classList.contains("is-fullscreen");

    if (!nativeFS && !cssFS) {
      enterStudyFullscreen();
      const doc = document.documentElement;
      const req = doc.requestFullscreen || doc.webkitRequestFullscreen;
      if (typeof req === "function") {
        try {
          const p = req.call(doc);
          if (p && typeof p.catch === "function") p.catch(() => {});
        } catch (e) {}
      }
    } else {
      exitStudyFullscreen();
      if (nativeFS) {
        try {
          if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen().catch(() => {});
        } catch (e) {}
      }
    }
  }

  el("fs").addEventListener("click", toggleFullscreen);
  document.addEventListener("fullscreenchange", () => {
    if (!document.fullscreenElement && document.body.classList.contains("is-fullscreen")) {
      exitStudyFullscreen();
    } else {
      resize();
    }
  });

  const seek = el("seek");
  let dragging = false, wasPlaying = false, lastSeek = 0;

  seek.addEventListener("pointerdown", () => {
    dragging = true;
    wasPlaying = Tone.Transport.state === "started";
    if (wasPlaying) {
      posTicks = ticksNow();
      Tone.Transport.pause();
      melodySynth.releaseAll();
      releaseAllPiano();
      releaseAllViolin();
    }
  });

  function endDrag() {
    if (!dragging) return;
    dragging = false;
    posTicks = Math.round(parseFloat(seek.value) * Tone.Transport.PPQ);
    if (wasPlaying) {
      enableIosPlaybackSession();
      Tone.Transport.start(undefined, posTicks + "i");
      wasPlaying = false;
    }
  }

  ["pointerup", "pointercancel", "change"].forEach(ev => seek.addEventListener(ev, endDrag));

  seek.addEventListener("input", () => {
    lastSeek = performance.now();
    posTicks = Math.round(parseFloat(seek.value) * Tone.Transport.PPQ);
    if (!dragging && Tone.Transport.state === "started") {
      Tone.Transport.pause();
      melodySynth.releaseAll();
      releaseAllPiano();
      releaseAllViolin();
      Tone.Transport.start(undefined, posTicks + "i");
    }
  });

  /* ============================================================================
     7. RENDERIZADO SYNTHESIA (CAÍDA + TECLADO A2-B4 + PENTAGRAMA DE VIOLÍN)
     ============================================================================ */
  const cv = el("cv");
  const ctx = cv.getContext("2d");
  const stage = el("stage");

  let W = 800, H = 450, dpr = 1;
  const L = {
    keyH: 130,
    fallH: 320,
    staffH: 0,
    whiteW: 42,
    blackW: 25,
    blackH: 80,
    pxPerBeat: 110
  };

  function computeLayout() {
    const isPortraitMobile = W < 650 && H >= W;
    const isLandscapeMobile = H < 500 && W > H;

    if (violinMode) {
      if (isPortraitMobile) {
        L.staffH = Math.max(108, Math.min(142, Math.round(H * 0.27)));
        L.keyH   = Math.max(85,  Math.min(120, Math.round(H * 0.21)));
      } else if (isLandscapeMobile) {
        L.staffH = Math.max(92,  Math.min(118, Math.round(H * 0.34)));
        L.keyH   = Math.max(60,  Math.min(82,  Math.round(H * 0.23)));
      } else {
        L.staffH = Math.max(118, Math.min(155, Math.round(H * 0.27)));
        L.keyH   = Math.max(98,  Math.min(140, Math.round(H * 0.22)));
      }
    } else {
      L.staffH = 0;
      if (isPortraitMobile) {
        L.keyH = Math.max(105, Math.min(148, Math.round(H * 0.24)));
      } else if (isLandscapeMobile) {
        L.keyH = Math.max(76, Math.min(108, Math.round(H * 0.30)));
      } else {
        L.keyH = Math.max(125, Math.min(180, Math.round(H * 0.25)));
      }
    }

    L.fallH = Math.max(62, H - L.keyH - L.staffH);
    L.whiteW = W / WHITE_KEYS.length;
    L.blackW = L.whiteW * 0.60;
    L.blackH = L.keyH * 0.62;

    const visibleBeats = isLandscapeMobile ? 3.2 : (isPortraitMobile ? 4.8 : 4.5);
    L.pxPerBeat = Math.max(42, L.fallH / visibleBeats);

    WHITE_KEYS.forEach((k, idx) => {
      k.x = idx * L.whiteW;
      k.w = L.whiteW;
      k.h = L.keyH;
    });

    BLACK_KEYS.forEach(k => {
      const boundaryX = k.whiteIndex * L.whiteW;
      k.x = boundaryX - L.blackW / 2;
      k.w = L.blackW;
      k.h = L.blackH;
    });
  }

  function resize() {
    const r = stage.getBoundingClientRect();
    W = Math.max(220, Math.floor(r.width));
    H = Math.max(150, Math.floor(r.height));
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = W * dpr;
    cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    computeLayout();
  }

  new ResizeObserver(resize).observe(stage);
  window.addEventListener("resize", resize);
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", resize);
  }
  resize();

  let manualPressedMidi = null;

  function findKeyAtPoint(px, py) {
    if (py < L.fallH || py > L.fallH + L.keyH) return null;
    const localY = py - L.fallH;
    for (const bk of BLACK_KEYS) {
      if (px >= bk.x && px <= bk.x + bk.w && localY <= bk.h) return bk;
    }
    for (const wk of WHITE_KEYS) {
      if (px >= wk.x && px <= wk.x + wk.w) return wk;
    }
    return null;
  }

  cv.addEventListener("pointerdown", async e => {
    const rect = cv.getBoundingClientRect();
    const key = findKeyAtPoint(e.clientX - rect.left, e.clientY - rect.top);
    if (!key) return;
    enableIosPlaybackSession();
    await Tone.start();
    manualPressedMidi = key.midi;
    triggerPianoNote(key.midi, "4n", undefined, 0.85);
  });

  ["pointerup", "pointercancel", "pointerleave"].forEach(ev => {
    cv.addEventListener(ev, () => { manualPressedMidi = null; });
  });

  function roundRectPath(x, y, w, h, r) {
    const radius = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.lineTo(x + w - radius, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
    ctx.lineTo(x + w, y + h - radius);
    ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
    ctx.lineTo(x + radius, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
    ctx.lineTo(x, y + radius);
    ctx.quadraticCurveTo(x, y, x + radius, y);
    ctx.closePath();
  }

  function drawBackgroundGrid(beat) {
    ctx.fillStyle = "#0F172A";
    ctx.fillRect(0, 0, W, L.fallH);

    for (let i = 0; i < WHITE_KEYS.length; i++) {
      const wk = WHITE_KEYS[i];
      if (wk.pc === 0) {
        ctx.strokeStyle = "rgba(148, 163, 184, 0.24)";
        ctx.lineWidth = 1.2;
      } else {
        ctx.strokeStyle = "rgba(148, 163, 184, 0.08)";
        ctx.lineWidth = 1;
      }
      ctx.beginPath();
      ctx.moveTo(wk.x, 0);
      ctx.lineTo(wk.x, L.fallH);
      ctx.stroke();
    }

    const measureBeats = PULSOS_POR_ACORDE * (song.pulseStepBeats || 1);
    const anchor = song.pulseAnchorBeat ?? song.lead;
    const maxVisibleBeat = beat + L.fallH / L.pxPerBeat + 1;
    const startIdx = Math.floor((beat - anchor) / measureBeats);
    for (let idx = startIdx; ; idx++) {
      const b = anchor + idx * measureBeats;
      if (b > maxVisibleBeat) break;
      if (b < 0) continue;
      const y = L.fallH - (b - beat) * L.pxPerBeat;
      if (y < 0 || y > L.fallH) continue;
      ctx.strokeStyle = "rgba(148, 163, 184, 0.18)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }
  }

  function drawFallingNotes(beat) {
    const activeHandsByMidi = new Map();
    const topVisibleBeat = beat + L.fallH / L.pxPerBeat + 0.5;

    const renderNoteBlock = (n) => {
      if (n.startBeat > topVisibleBeat) return;
      if (n.startBeat + n.durBeats < beat - 0.15) return;

      const key = KEY_BY_MIDI[n.displayMidi];
      if (!key) return;

      const isActive = beat >= n.startBeat && beat < n.startBeat + n.durBeats;
      if (isActive) {
        activeHandsByMidi.set(n.displayMidi, n.hand);
      }

      const bottomY = L.fallH - (n.startBeat - beat) * L.pxPerBeat;
      const rawH = n.durBeats * L.pxPerBeat;
      const blockH = Math.max(8, rawH - 2);
      const topY = bottomY - blockH;

      const clampedBottom = Math.min(L.fallH, bottomY);
      const clampedTop = Math.max(-20, topY);
      const drawH = clampedBottom - clampedTop;
      if (drawH <= 1) return;

      const padX = key.isBlack ? 1.5 : 2.5;
      const bx = key.x + padX;
      const bw = Math.max(6, key.w - padX * 2);

      let fillColor, borderColor, textColor;
      if (n.hand === "left") {
        fillColor = key.isBlack ? "#4ADE80" : "#86EFAC";
        borderColor = "#22C55E";
        textColor = "#052E16";
      } else {
        fillColor = key.isBlack ? "#FB923C" : "#FDBA74";
        borderColor = "#F97316";
        textColor = "#431407";
      }

      ctx.save();
      if (isActive) {
        ctx.shadowColor = fillColor;
        ctx.shadowBlur = 14;
      }

      roundRectPath(bx, clampedTop, bw, drawH, 6);
      ctx.fillStyle = fillColor;
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.lineWidth = isActive ? 2.2 : 1.3;
      ctx.strokeStyle = isActive ? "#FFFFFF" : borderColor;
      ctx.stroke();

      if (drawH >= 18 && bw >= 15) {
        const fontSize = Math.max(9, Math.min(13, Math.round(bw * 0.35)));
        ctx.fillStyle = textColor;
        ctx.font = `800 ${fontSize}px 'Nunito', sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "bottom";
        ctx.fillText(NOTE_NAMES_ES[key.pc], bx + bw / 2, clampedBottom - 3);
      }

      ctx.restore();
    };

    const allHandNotes = [...song.leftNotes, ...song.rightNotes];
    for (const n of allHandNotes) {
      const k = KEY_BY_MIDI[n.displayMidi];
      if (k && !k.isBlack) renderNoteBlock(n);
    }
    for (const n of allHandNotes) {
      const k = KEY_BY_MIDI[n.displayMidi];
      if (k && k.isBlack) renderNoteBlock(n);
    }

    return activeHandsByMidi;
  }

  function drawPianoKeyboard(activeHandsByMidi) {
    const topY = L.fallH;

    for (const wk of WHITE_KEYS) {
      const hand = activeHandsByMidi.get(wk.midi);
      const isManual = manualPressedMidi === wk.midi;
      let fill = "#FFFFFF";
      if (hand === "left") fill = "#86EFAC";
      else if (hand === "right") fill = "#FDBA74";
      else if (isManual) fill = "#C7D2FE";

      ctx.fillStyle = fill;
      ctx.fillRect(wk.x, topY, wk.w, wk.h);

      ctx.strokeStyle = "#94A3B8";
      ctx.lineWidth = 1;
      ctx.strokeRect(wk.x + 0.5, topY + 0.5, wk.w - 1, wk.h - 1);

      const showAllLabels = wk.w >= 22;
      if (showAllLabels || wk.pc === 0 || wk.midi === MIN_MIDI || wk.midi === MAX_MIDI) {
        const fontSize = Math.max(8, Math.min(13, Math.round(wk.w * 0.29)));
        ctx.fillStyle = hand ? "#0F172A" : (wk.pc === 0 ? "#4F46E5" : "#64748B");
        ctx.font = `${wk.pc === 0 ? "900" : "700"} ${fontSize}px 'Nunito', sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "bottom";
        ctx.fillText(wk.label, wk.x + wk.w / 2, topY + wk.h - 4);
      }
    }

    for (const bk of BLACK_KEYS) {
      const hand = activeHandsByMidi.get(bk.midi);
      const isManual = manualPressedMidi === bk.midi;
      let fill = "#1E293B";
      if (hand === "left") fill = "#4ADE80";
      else if (hand === "right") fill = "#FB923C";
      else if (isManual) fill = "#818CF8";

      ctx.save();
      roundRectPath(bk.x, topY, bk.w, bk.h, 4);
      ctx.fillStyle = fill;
      ctx.fill();

      ctx.lineWidth = 1.2;
      ctx.strokeStyle = hand ? "#FFFFFF" : "#0F172A";
      ctx.stroke();

      if (bk.pc === 10 && bk.w >= 15) {
        const fontSize = Math.max(8, Math.min(11, Math.round(bk.w * 0.44)));
        ctx.fillStyle = hand ? "#052E16" : "#CBD5E1";
        ctx.font = `800 ${fontSize}px 'Nunito', sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "bottom";
        ctx.fillText("Sib", bk.x + bk.w / 2, topY + bk.h - 4);
      }
      ctx.restore();
    }

    ctx.fillStyle = "#4F46E5";
    ctx.fillRect(0, topY - 2, W, 3);
  }

  /* ============================================================================
     8. PENTAGRAMA DE VIOLÍN (CLAVE DE SOL, DESPLAZAMIENTO HORIZONTAL)
     ============================================================================ */
  const PC_TO_STAFF_INFO = {
    0:  { step: 0, acc: ""  },
    1:  { step: 0, acc: "♯" },
    2:  { step: 1, acc: ""  },
    3:  { step: 2, acc: "♭" },
    4:  { step: 2, acc: ""  },
    5:  { step: 3, acc: ""  },
    6:  { step: 3, acc: "♯" },
    7:  { step: 4, acc: ""  },
    8:  { step: 4, acc: "♯" },
    9:  { step: 5, acc: ""  },
    10: { step: 6, acc: "♭" },
    11: { step: 6, acc: ""  }
  };

  function midiToTrebleStep(midi) {
    const pc = ((midi % 12) + 12) % 12;
    const octave = Math.floor(midi / 12) - 1;
    const info = PC_TO_STAFF_INFO[pc];
    const absStep = octave * 7 + info.step - 30;
    return { step: absStep, acc: info.acc, pc };
  }

  function drawViolinStaff(beat) {
    if (!violinMode || L.staffH <= 0) return;

    const staffTop = L.fallH + L.keyH;
    const staffH = L.staffH;

    ctx.save();
    ctx.beginPath();
    ctx.rect(0, staffTop, W, staffH);
    ctx.clip();

    ctx.fillStyle = "#FFFDF9";
    ctx.fillRect(0, staffTop, W, staffH);

    ctx.fillStyle = "#7C3AED";
    ctx.fillRect(0, staffTop, W, 3);

    const lineGap = Math.max(7.2, Math.min(11.5, staffH * 0.082));
    const halfStep = lineGap / 2;
    const bottomLineY = staffTop + staffH * 0.65;
    const topLineY = bottomLineY - 4 * lineGap;

    ctx.strokeStyle = "#94A3B8";
    ctx.lineWidth = 1.15;
    for (let i = 0; i < 5; i++) {
      const y = bottomLineY - i * lineGap;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }

    const clefAreaW = 54;
    const playheadX = Math.min(92, Math.max(72, W * 0.12));
    const staffPxPerBeat = Math.max(54, Math.min(96, W / 10.5));

    const measureBeats = PULSOS_POR_ACORDE * (song.pulseStepBeats || 1);
    const anchor = song.pulseAnchorBeat ?? song.lead;
    const minBeatVisible = beat - (playheadX - clefAreaW) / staffPxPerBeat - 1;
    const maxBeatVisible = beat + (W - playheadX) / staffPxPerBeat + 2;
    const startIdx = Math.floor((minBeatVisible - anchor) / measureBeats);

    for (let idx = startIdx; ; idx++) {
      const b = anchor + idx * measureBeats;
      if (b > maxBeatVisible) break;
      const x = playheadX + (b - beat) * staffPxPerBeat;
      if (x < clefAreaW) continue;
      ctx.strokeStyle = "#CBD5E1";
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(x, topLineY);
      ctx.lineTo(x, bottomLineY);
      ctx.stroke();

      const measureNum = idx + 1;
      if (measureNum >= 1) {
        ctx.fillStyle = "#94A3B8";
        ctx.font = "700 10px 'Nunito', sans-serif";
        ctx.textAlign = "left";
        ctx.textBaseline = "bottom";
        ctx.fillText(String(measureNum), x + 4, topLineY - 3);
      }
    }

    if (!song.hasViolinMidi) {
      ctx.fillStyle = "#6D28D9";
      ctx.font = "800 13px 'Nunito', sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("Coloca el archivo ./midis/violin.mid para ver y escuchar el pentagrama de violín", W / 2 + 20, (topLineY + bottomLineY) / 2);
    } else {
      const rx = lineGap * 0.62;
      const ry = lineGap * 0.46;

      for (const n of song.violinNotes) {
        if (n.startBeat + n.durBeats < minBeatVisible) continue;
        if (n.startBeat > maxBeatVisible) break;

        const nx = playheadX + (n.startBeat - beat) * staffPxPerBeat;
        if (nx < clefAreaW - 16) continue;

        const { step, acc, pc } = midiToTrebleStep(n.midi);
        const ny = bottomLineY - step * halfStep;
        const isActive = beat >= n.startBeat && beat < n.startBeat + n.durBeats;
        const isVoice2 = n.voice === 2;

        const noteColor = isActive
          ? "#DC2626"
          : (isVoice2 ? "#6D28D9" : "#0F766E");

        const durW = Math.max(rx * 2, n.durBeats * staffPxPerBeat - 4);
        ctx.fillStyle = isActive ? "rgba(220, 38, 38, 0.16)" : "rgba(124, 58, 237, 0.10)";
        roundRectPath(nx - rx, ny - ry * 0.8, durW, ry * 1.6, 4);
        ctx.fill();

        ctx.strokeStyle = "#64748B";
        ctx.lineWidth = 1.2;
        if (step <= -2) {
          for (let s = -2; s >= step; s -= 2) {
            const ly = bottomLineY - s * halfStep;
            ctx.beginPath();
            ctx.moveTo(nx - rx - 4, ly);
            ctx.lineTo(nx + rx + 4, ly);
            ctx.stroke();
          }
        } else if (step >= 10) {
          for (let s = 10; s <= step; s += 2) {
            const ly = bottomLineY - s * halfStep;
            ctx.beginPath();
            ctx.moveTo(nx - rx - 4, ly);
            ctx.lineTo(nx + rx + 4, ly);
            ctx.stroke();
          }
        }

        if (acc) {
          ctx.fillStyle = noteColor;
          ctx.font = `800 ${Math.round(lineGap * 1.35)}px 'Nunito', sans-serif`;
          ctx.textAlign = "right";
          ctx.textBaseline = "middle";
          ctx.fillText(acc, nx - rx - 2, ny);
        }

        const isHollow = n.durBeats >= 1.75;
        ctx.save();
        ctx.translate(nx, ny);
        ctx.rotate(-0.28);
        ctx.beginPath();
        ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
        if (isHollow) {
          ctx.fillStyle = "#FFFDF9";
          ctx.fill();
          ctx.lineWidth = 1.9;
          ctx.strokeStyle = noteColor;
          ctx.stroke();
        } else {
          ctx.fillStyle = noteColor;
          ctx.fill();
        }
        ctx.restore();

        if (n.durBeats >= 2.75 && n.durBeats <= 3.3) {
          ctx.fillStyle = noteColor;
          ctx.beginPath();
          ctx.arc(nx + rx + 4.5, ny - (step % 2 === 0 ? halfStep * 0.45 : 0), 2.1, 0, Math.PI * 2);
          ctx.fill();
        }

        if (n.durBeats < 3.75) {
          const stemH = lineGap * 2.85;
          const stemUp = step < 4;
          ctx.strokeStyle = noteColor;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          if (stemUp) {
            ctx.moveTo(nx + rx - 0.8, ny);
            ctx.lineTo(nx + rx - 0.8, ny - stemH);
          } else {
            ctx.moveTo(nx - rx + 0.8, ny);
            ctx.lineTo(nx - rx + 0.8, ny + stemH);
          }
          ctx.stroke();

          if (n.durBeats <= 0.6) {
            ctx.beginPath();
            if (stemUp) {
              ctx.moveTo(nx + rx - 0.8, ny - stemH);
              ctx.quadraticCurveTo(nx + rx + 6, ny - stemH + 5, nx + rx + 4, ny - stemH + 12);
            } else {
              ctx.moveTo(nx - rx + 0.8, ny + stemH);
              ctx.quadraticCurveTo(nx - rx + 6, ny + stemH - 5, nx - rx + 4, ny + stemH - 12);
            }
            ctx.stroke();
          }
        }

        if (staffH >= 88) {
          const labelY = Math.min(staffTop + staffH - 3, Math.max(bottomLineY + lineGap * 1.5, ny + lineGap * 1.4));
          ctx.fillStyle = isActive ? "#DC2626" : "#475569";
          ctx.font = `${isActive ? "900" : "700"} 9.5px 'Nunito', sans-serif`;
          ctx.textAlign = "center";
          ctx.textBaseline = "bottom";
          ctx.fillText(NOTE_NAMES_ES[pc], nx, labelY);
        }
      }
    }

    ctx.strokeStyle = "#EF4444";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(playheadX, staffTop + 5);
    ctx.lineTo(playheadX, staffTop + staffH - 4);
    ctx.stroke();

    ctx.fillStyle = "#F8FAFC";
    ctx.fillRect(0, staffTop + 3, clefAreaW, staffH - 3);
    ctx.strokeStyle = "#E2E8F0";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(clefAreaW, staffTop + 3);
    ctx.lineTo(clefAreaW, staffTop + staffH);
    ctx.stroke();

    ctx.strokeStyle = "#94A3B8";
    ctx.lineWidth = 1.15;
    for (let i = 0; i < 5; i++) {
      const y = bottomLineY - i * lineGap;
      ctx.beginPath();
      ctx.moveTo(4, y);
      ctx.lineTo(clefAreaW, y);
      ctx.stroke();
    }

    ctx.fillStyle = "#1E293B";
    ctx.font = `${Math.round(lineGap * 5.2)}px serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("𝄞", 24, bottomLineY - lineGap * 1.85);

    ctx.fillStyle = "#7C3AED";
    ctx.font = "800 9.5px 'Nunito', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    ctx.fillText("VIOLÍN", clefAreaW / 2, staffTop + 6);

    ctx.restore();
  }

  const fmtTime = s => {
    s = Math.max(0, Math.round(s));
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  };

  function frame() {
    const beat = getBeat() || 0;
    const isPlaying = Tone.Transport.state === "started";

    drawBackgroundGrid(beat);
    const activeHands = drawFallingNotes(beat);
    drawPianoKeyboard(activeHands);
    drawViolinStaff(beat);
    updateChordDisplay(beat);
    updateStrummingAnimation(beat, isPlaying);

    if (song.loaded) {
      const spb = 60 / (song.bpm * speed);
      const cur = Math.min(beat, song.endBeat);
      el("time").textContent = fmtTime(cur * spb) + " / " + fmtTime(song.endBeat * spb);
      if (!dragging && performance.now() - lastSeek > 150) {
        seek.value = Math.min(beat, song.endBeat);
      }
    }

    if (isPlaying && beat > song.endBeat) {
      resetPlayback();
    }

    requestAnimationFrame(frame);
  }

  loadAllMidis();
  requestAnimationFrame(frame);
}

if (document.readyState === "complete") {
  initApp();
} else {
  window.addEventListener("load", initApp);
}
</script>
</body>
</html>
